fracciones de sus leyes (aduanas, fiscal, inmigración, sanidad).<\/li><li><b>ZEE (hasta 200 mn)<\/b>: derechos de soberanía para <b>explorar, explotar, conservar y administrar<\/b> los recursos.<\/li><li><b>Plataforma continental<\/b>: derechos de <b>exploración y explotación del lecho<\/b> hasta el borde de la plataforma o ~200 mn.<\/li><\/ul>"}], "ctx": "1. Tipos de transporte marítimo \n \n \n \n \n Línea regular (liner) \n Tramp (servicios ocasionales) \n \n \n \n \n Rutas y horarios \n Itinerarios y frecuencias fijos \n Sin rutas ni horarios fijos \n \n \n Carga típica \n Contenerizada / carga general \n Carga general, granel , cargas de buque completo \n \n \n Contrato \n Conocimiento de embarque (B/L) \n Póliza de fletamento (se fleta el buque completo) \n \n \n Gastos \n Por cuenta de la naviera \n Por cuenta del cargador \n \n \n \n 2. Organismos internacionales públicos \n 2.1 ONU → CONVEMAR (UNCLOS) \n \n Convención de la ONU sobre el Derecho del Mar; hubo tres conferencias (UNCLOS I, II y III). \n \n Líneas base (LB) \n \n Separan las aguas interiores del mar territorial . \n LB normal : coincide con la línea de bajamar (nivel más bajo del agua). \n LB recta : polígonos que unen vértices próximos a la costa. \n \n Espacios marítimos (medidos desde la LB) \n \n \n \n Espacio \n Extensión \n Derechos del Estado ribereño \n \n \n \n \n Mar territorial (MT) \n Hasta 12 mn \n Soberanía. Si dos Estados se solapan, UNCLOS fija la línea media \n \n \n Zona contigua (ZC) \n Hasta 24 mn \n Fiscalización : prevenir y sancionar infracciones de sus leyes \n \n \n Zona económica exclusiva (ZEE) \n Hasta 200 mn \n Derechos de soberanía para explorar, explotar, conservar y administrar \n \n \n Plataforma continental (PC) \n Desde el límite exterior del MT hasta el borde de la plataforma o ~ 200 mn \n Exploración y explotación de recursos naturales del lecho \n \n \n Alta mar (AM) \n Resto (\" aguas internacionales \") \n Común a todos : libertad de navegación, sobrevuelo y pesca, siempre con fines pacíficos \n \n \n \n \n Derecho de paso inocente : los buques extranjeros pueden cruzar el MT de otro Estado si el paso es rápido e ininterrumpido . También se aplica en estrechos . \n \n 2.2 IMO (Organización Marítima Internacional) \n \n Misión : seguridad y protección del transporte marítimo y prevención de la contaminación marina y atmosférica. \n \n Comités \n \n Transversales \n Comité de Cooperación Técnica \n Comité Jurídico \n \n \n Técnicos \n Comité de Seguridad Marítima → seguridad y protección \n SOLAS : seguridad de la vida humana en el mar \n STCW : formación y titulación de la gente de mar \n \n \n Comité de Protección del Medio Marino → contaminación procedente de buques \n Comité de Facilitación → facilitar el tráfico marítimo internacional \n \n \n \n Normativa ambiental clave \n \n MARPOL 73/78 → en 2011 se adoptan normas obligatorias de eficiencia energética . \n IMO 2020 (en vigor el 1/1/2020 ) \n Límite de azufre en el combustible: de 3,5 % → 0,5 % \n En zonas determinadas (ECA): 0,1 % \n En puertos de la UE : 0,1 % desde 2010 \n Cómo cumplir: combustible bajo en azufre (más caro) o sistemas de limpieza de gases (scrubbers) \n \n \n IMO GEI → estrategia de 2023 para reducir gases de efecto invernadero . \n \n Otros convenios IMO \n \n Reglamento para prevenir abordajes \n Convenio sobre líneas de carga \n Convenio sobre arqueo de buques \n \n 2.3 Otras organizaciones internacionales \n \n De la ONU: UNCTAD , Organización Mundial del Comercio \n Organización Internacional del Trabajo (OIT) \n Organización Mundial de Aduanas (OMA) \n Asociación de Derecho Internacional → regulación de accidentes \n \n 3. Organismos internacionales privados \n 3.1 Sociedades de clasificación \n \n Inscriben (\"clasifican\") el buque en el registro de una empresa privada especializada. \n No es obligatorio , pero lo suelen exigir las aseguradoras . \n Actividad a lo largo de la vida del buque: \n Antes de construir → revisión del proyecto \n Durante la construcción → inspecciones de comprobación \n Vida útil → inspecciones periódicas \n \n \n \n 3.2 BIMCO \n \n Publica contratos tipo de transporte marítimo. \n \n 3.3 Otros \n \n Comité Marítimo Internacional (CMI) \n Cámara de Comercio Internacional (CCI) \n Aseguradoras \n Liner = B/L + naviera paga · Tramp = póliza de fletamento + cargador paga \n Distancias desde la LB: MT 12 · ZC 24 · ZEE 200 mn \n IMO 2020 : azufre 3,5 % → 0,5 % (0,1 % en zonas especiales y puertos UE) \n SOLAS = seguridad de la vida en el mar · STCW = formación de tripulaciones · MARPOL = contaminación \n Las sociedades de clasificación no son obligatorias, pero las aseguradoras las exigen\nAMPLIACIÓN DE LAS DIAPOSITIVAS: UNCLOS : UNCLOS I (Ginebra 1958) y II (1960) sin acuerdo sobre la anchura del mar territorial. UNCLOS III = Convención de Montego Bay 1982 , en vigor en 1994 ; España la ratificó en 1997. Regula también el tránsito por estrechos sin peajes y el Tribunal Internacional del Derecho del Mar. \n IMO : creada en 1948 como IMCO, operativa desde 1958, sede en Londres . Órganos: Asamblea, Consejo y Secretaría. Comités: MSC (seguridad), MEPC (medio marino), FAL (facilitación), TC y LEG. \n SOLAS : nace en 1914 tras el Titanic ; la versión vigente es la de 1974 . Construcción, incendios, salvamento, radio, navegación, cargas (VGM desde 2016), mercancías peligrosas y los códigos ISM e ISPS. \n MARPOL 73/78 : en vigor en 1983, 6 anexos : hidrocarburos, sustancias nocivas líquidas, sustancias en bultos, aguas sucias, basuras y contaminación atmosférica (SOx, NOx, EEDI/SEEMP). \n ISM (SOLAS cap. IX): sistema de gestión de la seguridad de la naviera; certificados DOC (compañía) y SMC (buque). ISPS (cap. XI-2, tras el 11-S, 2004): protección frente a actos ilícitos, con niveles 1, 2 y 3. \n STCW (1978, revisado 1995 y 2010): mínimos de formación, titulación y guardias de la gente de mar. \n Port State Control : el puerto inspecciona buques extranjeros y puede detenerlos. Se coordina en MoU regionales; España está en el Paris MoU . \n Sociedades de clasificación : Lloyd's Register, Bureau Veritas, DNV, ABS, RINA, ClassNK (IACS). Actúan por delegación de la bandera. \n Mar del Sur de China : pasa ~30 % del comercio marítimo. Reclamaciones solapadas (China, Filipinas, Vietnam, Malasia, Brunéi, Taiwán) sobre Spratly y Paracel; la \"línea de nueve trazos\" choca con las ZEE de UNCLOS (laudo de La Haya 2016)."}, {"id": "t22", "num": "2.2", "title": "Regulación nacional del transporte marítimo", "short": "Reg. nacional", "fuente": "Apuntes JH del Tema 2.2 + diapositivas del profesor", "estudio": "<h2>1. Introducción<\/h2>\n<ul>\n<li><strong>Abanderamiento<\/strong>: al buque se le aplica la <strong>legislación del país de su bandera<\/strong>, sobre todo la <strong>laboral y la fiscal<\/strong><ul>\n<li>Los países aprueban normativa específica para sus buques: los <strong>registros especiales<\/strong><\/li>\n<\/ul>\n<\/li>\n<li><strong>Normativa de la UE<\/strong>: las <strong>directivas<\/strong> se <strong>trasponen<\/strong> a leyes y reglamentos españoles<\/li>\n<\/ul>\n<h2>2. Competencia normativa<\/h2>\n<h3>2.1 Constitución de 1978<\/h3>\n<table>\n<thead>\n<tr>\n<th>Artículo<\/th>\n<th>Contenido<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Art. 132<\/strong><\/td>\n<td>Son <strong>dominio público estatal<\/strong> el <strong>MT<\/strong>, la <strong>ZEE<\/strong> y la <strong>PC<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 148<\/strong><\/td>\n<td>Las <strong>CCAA<\/strong> pueden asumir competencias en <strong>puertos sin actividad comercial<\/strong> y en <strong>pesca en aguas interiores<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 149<\/strong><\/td>\n<td><strong>Competencia exclusiva del Estado<\/strong>: régimen <strong>aduanero<\/strong>, <strong>pesca marítima<\/strong>, <strong>marina mercante y abanderamiento<\/strong>, <strong>puertos de interés general<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>La Constitución <strong>no dice nada de las aguas interiores<\/strong><\/li>\n<li>Términos como \"marina mercante\" o \"actividades comerciales\" se <strong>aclaran después en otras leyes<\/strong><\/li>\n<\/ul>\n<h3>2.2 Ley de Puertos del Estado y de la Marina Mercante (1992)<\/h3>\n<ul>\n<li><strong>Estructura<\/strong><ul>\n<li><strong>Título preliminar<\/strong> → define los términos que faltaban por aclarar<\/li>\n<li><strong>Títulos I y II<\/strong> → organizan el <strong>sistema portuario de interés general<\/strong><\/li>\n<li><strong>Título III<\/strong> → organiza la <strong>marina mercante<\/strong><\/li>\n<li><strong>Título IV<\/strong> → <strong>inspección<\/strong> y <strong>régimen sancionador<\/strong><\/li>\n<\/ul>\n<\/li>\n<li>Modificada varias veces, sobre todo en materia portuaria<\/li>\n<li><strong>Texto refundido de 2010<\/strong> → es la <strong>referencia actual<\/strong><\/li>\n<\/ul>\n<h4>Qué se considera marina mercante<\/h4>\n<ul>\n<li><strong>Transporte marítimo<\/strong><\/li>\n<li><strong>Ordenación y control de la flota civil<\/strong> española<\/li>\n<li><strong>Seguridad en la navegación<\/strong> y <strong>salvamento marítimo<\/strong><\/li>\n<li><strong>Prevención de la contaminación<\/strong><\/li>\n<li><strong>Inspección técnica de buques<\/strong><\/li>\n<li><strong>Ordenación del tráfico y comunicaciones<\/strong><\/li>\n<li><strong>Abanderamiento y registro<\/strong> de buques<\/li>\n<\/ul>\n<h4>Qué NO se considera marina mercante<\/h4>\n<ul>\n<li>La <strong>flota pesquera<\/strong>: su ordenación, la del sector y su actividad inspectora<\/li>\n<\/ul>\n<h3>2.3 Ley de Navegación Marítima (2014)<\/h3>\n<ul>\n<li>Una parte <strong>administrativa<\/strong> y el resto esencialmente <strong>derecho mercantil<\/strong><\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th><strong>Ley de Marina Mercante<\/strong><\/th>\n<th><strong>Ley de Navegación Marítima<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Organiza la <strong>actuación del Estado<\/strong> sobre navegación y tráfico marítimo<\/td>\n<td>Regula la navegación en <strong>derecho público y privado<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Seguridad, ordenación y prevención de la contaminación<\/td>\n<td>Regula la <strong>normativa mercantil<\/strong> del tráfico marítimo<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>3. La administración marítima<\/h2>\n<ul>\n<li><strong>Capitanías marítimas<\/strong>, organizadas por <strong>provincias marítimas<\/strong><ul>\n<li>Cada provincia se subdivide en <strong>distritos marítimos<\/strong><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>4. Paso por puertos españoles: autoridades y controles<\/h2>\n<table>\n<thead>\n<tr>\n<th>Autoridad<\/th>\n<th>Función<\/th>\n<th>Norma / trámite<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Policía Nacional<\/strong> (Comisaría General de Extranjería y Fronteras)<\/td>\n<td>Control de <strong>entrada y salida<\/strong> de personas en buques extranjeros<\/td>\n<td>Normativa <strong>Schengen<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Aduanas e Impuestos Especiales<\/strong> (AEAT)<\/td>\n<td>Trámites de entrada/salida de <strong>mercancías<\/strong><\/td>\n<td><strong>Código Aduanero de la Unión<\/strong> → <strong>despacho aduanero<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Capitanías marítimas<\/strong><\/td>\n<td><strong>Autorizan o prohíben la entrada de buques<\/strong> en aguas españolas, sobre todo los extranjeros<\/td>\n<td><strong>Despacho de buques<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Sanidad Exterior<\/strong><\/td>\n<td>Lucha contra <strong>epidemias<\/strong> y control higiénico-sanitario de productos de <strong>consumo humano<\/strong><\/td>\n<td><strong>Despacho de sanidad<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Otros controles<\/strong>: sanidad <strong>animal<\/strong>, sanidad <strong>vegetal<\/strong> e inspección de <strong>farmacia<\/strong><\/li>\n<\/ul>\n<h2>5. Regulación europea<\/h2>\n<table>\n<thead>\n<tr>\n<th>Norma<\/th>\n<th>Año<\/th>\n<th>Idea clave<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>EMSA<\/strong> (Agencia Europea de Seguridad Marítima)<\/td>\n<td><strong>2002<\/strong><\/td>\n<td>Lucha contra <strong>siniestralidad y contaminación<\/strong>, y después <strong>vigilancia de las aguas<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Ventanilla única marítima<\/strong><\/td>\n<td><strong>2019<\/strong><\/td>\n<td><strong>Despachos uniformes<\/strong> de entrada y salida en puertos UE<\/td>\n<\/tr>\n<tr>\n<td><strong>Directiva 2014/94<\/strong><\/td>\n<td>2014<\/td>\n<td><strong>Combustibles alternativos<\/strong>: puntos de <strong>LNG<\/strong> y <strong>electricidad en atraque<\/strong> para <strong>finales de 2025<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Fit for 55<\/strong><\/td>\n<td><strong>2021<\/strong><\/td>\n<td>Reducir las emisiones un <strong>55 %<\/strong> para <strong>2030<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>FuelEU Maritime<\/strong><\/td>\n<td><strong>2023<\/strong><\/td>\n<td>Plazos obligatorios de <strong>LNG<\/strong> y <strong>OPS<\/strong> en los <strong>puertos Core<\/strong> de la UE<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "ideas": "<ul>\n<li><strong>Bandera<\/strong> = se aplica la ley laboral y fiscal de ese país<\/li>\n<li><strong>CE 1978<\/strong>: <strong>132<\/strong> dominio público · <strong>148<\/strong> CCAA · <strong>149<\/strong> competencia exclusiva del Estado<\/li>\n<li><strong>Ley de 1992<\/strong>, con <strong>texto refundido de 2010<\/strong> · <strong>Ley de Navegación Marítima de 2014<\/strong><\/li>\n<li>La <strong>pesca no es marina mercante<\/strong><\/li>\n<li>Despachos: <strong>aduanero<\/strong> (AEAT) · <strong>de buques<\/strong> (Capitanía) · <strong>de sanidad<\/strong> (Sanidad Exterior) · fronteras (Policía, Schengen)<\/li>\n<li><strong>EMSA 2002<\/strong> · <strong>Dir. 2014/94<\/strong> (LNG + OPS 2025) · <strong>Fit for 55<\/strong> (−55 % en 2030) · <strong>FuelEU Maritime 2023<\/strong><\/li>\n<\/ul>", "amplia": "\n<ul>\n<li><b>TRLPEMM<\/b>: Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, <b>Real Decreto Legislativo 2/2011<\/b>. Parte de la <b>Ley 27/1992<\/b>, que unió puertos y marina mercante y derogó más de 20 leyes, reformada en 1997, 2003 y 2010.<\/li>\n<li><b>Sistema portuario<\/b>: Puertos del Estado y las Autoridades Portuarias gestionan los puertos de interés general.<\/li>\n<li><b>Administración marítima<\/b>: Dirección General de la Marina Mercante, <b>SASEMAR<\/b> (salvamento) y Capitanías Marítimas.<\/li>\n<li><b>Ley 14/2014 de Navegación Marítima<\/b>: sobre todo derecho mercantil (contratos, fletamento arts. 203–286). En 2024 se tramita una reforma conjunta de ambas leyes.<\/li>\n<li><b>EMSA<\/b>: creada en 2002, sede en <b>Lisboa<\/b>, tras el <b>Erika<\/b> y el <b>Prestige<\/b>. Coordina el Port State Control europeo, vigila vertidos por satélite y gestiona el <b>EMSWe<\/b> (Reglamento 2019/1239). En España la ventanilla única es <b>DUEPORT<\/b>.<\/li>\n<li><b>Emisiones UE<\/b>: EU ETS para el transporte marítimo desde 2024 (40 % en 2024, 70 % en 2025, 100 % desde 2026) y FuelEU Maritime (Reglamento 2023/1805) que limita la intensidad de GEI de la energía usada.<\/li>\n<\/ul>", "mapa": {"root": "Regulación nacional", "ramas": [{"t": "Bandera", "h": ["Ley laboral y fiscal del país", "Registros especiales", "Directivas UE traspuestas"]}, {"t": "Constitución 1978", "h": ["Art. 132: MT, ZEE y PC dominio público", "Art. 148: CCAA, puertos no comerciales", "Art. 149: Estado, marina mercante y puertos de interés general"]}, {"t": "Leyes", "h": ["Puertos y Marina Mercante 1992", "Texto refundido (RDL 2/2011)", "Navegación Marítima 2014: mercantil", "La pesca no es marina mercante"]}, {"t": "Administración", "h": ["Capitanías marítimas", "Provincias y distritos marítimos", "DGMM · SASEMAR"]}, {"t": "Paso por puerto", "h": ["Policía: fronteras (Schengen)", "AEAT: despacho aduanero", "Capitanía: despacho de buques", "Sanidad Exterior: despacho de sanidad"]}, {"t": "Unión Europea", "h": ["EMSA 2002", "Ventanilla única 2019", "Dir. 2014/94: GNL y OPS 2025", "Fit for 55 · FuelEU Maritime"]}]}, "banco": [{"id": "B4-9", "src": "Tema 4 · 9", "q": "Resume los aspectos principales de la Ley de Puertos del Estado y de la Marina Mercante (TRLPEMM).", "a": "\n<p>El Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante (Real Decreto Legislativo 2/2011) es la referencia actual.<\/p>\n<ul><li><p><b>Origen<\/b>: la Ley 27/1992 unió las leyes de puertos y de marina mercante y derogó más de 20 leyes anteriores. Tras las reformas de 1997, 2003 y 2010, el texto refundido de 2011 lo reúne todo en un único texto legible.<\/p><\/li><li><p><b>Contenido<\/b>: define los términos que dejó abiertos la Constitución (puertos de interés general, actividades comerciales portuarias, marina mercante); organiza el sistema portuario estatal (Puertos del Estado y Autoridades Portuarias), el dominio público, los servicios y las tasas; y fija el régimen de policía y sanciones.<\/p><\/li><li><p><b>Marina mercante<\/b>: transporte marítimo (salvo el interior de una comunidad autónoma), flota civil, seguridad de la navegación y de la vida humana, salvamento, contaminación, inspección de buques, tráfico y comunicaciones, y abanderamiento y registro. No incluye la flota pesquera.<\/p><\/li><li><p><b>Administración marítima<\/b>: Dirección General de la Marina Mercante, SASEMAR y Capitanías Marítimas.<\/p><\/li><\/ul>\n<p>Se complementa con la Ley 14/2014 de Navegación Marítima, de carácter sobre todo mercantil. En diciembre de 2024 el Congreso aprobó un proyecto de reforma conjunta de ambas, que según el profesor seguía su trámite en el Senado.<\/p>\n"}, {"id": "B4-10", "src": "Tema 4 · 10", "q": "Explica el papel de la Agencia Europea de Seguridad Marítima (EMSA).", "a": "\n<p>Creada por la UE en 2002 (sede en Lisboa), inicialmente para luchar contra los accidentes marítimos y la contaminación en aguas europeas, tras los desastres del Erika y el Prestige.<\/p>\n<ul><li><p>Apoyo técnico a la Comisión y a los Estados en la aplicación de la normativa marítima de la UE.<\/p><\/li><li><p>Coordinación del Port State Control europeo (Paris MoU), incluidas las inspecciones sobre emisiones.<\/p><\/li><li><p>Vigilancia y seguridad de las aguas: seguimiento del tráfico, detección de vertidos por satélite y buques anticontaminación.<\/p><\/li><li><p>Entorno europeo de ventanilla única marítima (EMSWe, Reglamento 2019/1239) y despachos de Marina uniformes; en España, DUEPORT.<\/p><\/li><li><p>Apoyo en la normativa ambiental (combustibles alternativos, OPS, Fit for 55, FuelEU Maritime).<\/p><\/li><\/ul>\n"}], "propias": [{"id": "t22-c1", "q": "¿Qué implica para un buque su abanderamiento?", "a": "<p>Supone que al buque se le aplica la <b>legislación del país de su bandera<\/b>, sobre todo la <b>laboral y la fiscal<\/b>; a efectos legales es territorio de ese país. Los Estados aprueban normas específicas para sus buques, los <b>registros especiales<\/b>. Las <b>banderas de conveniencia<\/b> ofrecen ventajas fiscales.<\/p>"}, {"id": "t22-c2", "q": "Explica qué dicen los artículos 132, 148 y 149 de la Constitución de 1978 en materia marítima.", "a": "<ul><li><b>Art. 132<\/b>: son <b>dominio público estatal<\/b> el mar territorial, la ZEE y la plataforma continental.<\/li><li><b>Art. 148<\/b>: las <b>CCAA<\/b> pueden asumir puertos <b>sin actividad comercial<\/b> y la pesca en aguas interiores.<\/li><li><b>Art. 149<\/b>: competencia <b>exclusiva del Estado<\/b> en régimen aduanero, pesca marítima, <b>marina mercante y abanderamiento<\/b> y <b>puertos de interés general<\/b>.<\/li><\/ul><p>La Constitución no dice nada de las aguas interiores.<\/p>"}, {"id": "t22-c3", "q": "¿Qué se considera marina mercante según la Ley de Puertos y de la Marina Mercante? ¿Qué queda fuera?", "a": "<p>Se considera marina mercante: el <b>transporte marítimo<\/b>, la ordenación de la <b>flota civil<\/b>, la <b>seguridad<\/b> en la navegación y el <b>salvamento<\/b>, la <b>prevención de la contaminación<\/b>, la <b>inspección técnica<\/b> de buques, la ordenación del <b>tráfico y las comunicaciones<\/b> y el <b>abanderamiento y registro<\/b>. Queda fuera la <b>flota pesquera<\/b>: su ordenación, la del sector y su inspección.<\/p>"}, {"id": "t22-c4", "q": "Compara la Ley de Puertos del Estado y de la Marina Mercante con la Ley de Navegación Marítima de 2014.", "a": "<ul><li><b>Marina Mercante (1992, texto refundido actual)<\/b>: organiza la <b>actuación del Estado<\/b> sobre navegación y tráfico: seguridad, ordenación y contaminación. Derecho administrativo.<\/li><li><b>Navegación Marítima (2014)<\/b>: regula la navegación en derecho público y privado; es sobre todo <b>derecho mercantil<\/b> (contratos, fletamentos).<\/li><\/ul>"}, {"id": "t22-c5", "q": "¿Qué autoridades intervienen cuando un buque extranjero hace escala en un puerto español?", "a": "<ul><li><b>Policía Nacional<\/b> (Extranjería y Fronteras): control de personas, normativa <b>Schengen<\/b>.<\/li><li><b>Aduanas (AEAT)<\/b>: <b>despacho aduanero<\/b> de las mercancías según el Código Aduanero de la Unión.<\/li><li><b>Capitanía Marítima<\/b>: <b>despacho de buques<\/b>, autoriza o prohíbe la entrada.<\/li><li><b>Sanidad Exterior<\/b>: <b>despacho de sanidad<\/b>, epidemias y productos de consumo humano.<\/li><li>Otros: sanidad animal, vegetal y farmacia.<\/li><\/ul>"}, {"id": "t22-c6", "q": "¿Qué son las capitanías marítimas y cómo se organizan?", "a": "<p>Son los órganos de la <b>administración marítima<\/b> periférica del Estado. Autorizan o prohíben la entrada y salida de buques (<b>despacho de buques<\/b>) y velan por la seguridad y la contaminación. Se organizan <b>provincialmente<\/b> en <b>provincias marítimas<\/b>, que se subdividen en <b>distritos marítimos<\/b>.<\/p>"}, {"id": "t22-c7", "q": "¿Qué obliga la Directiva 2014/94?", "a": "<p>Busca facilitar el uso de <b>combustibles alternativos<\/b> en todos los modos. Obliga a que haya un número adecuado de puntos de repostaje de <b>GNL<\/b> y <b>suministro eléctrico en tierra (OPS)<\/b> en los atraques para <b>finales de 2025<\/b>.<\/p>"}, {"id": "t22-c8", "q": "Explica Fit for 55 y FuelEU Maritime.", "a": "<ul><li><b>Fit for 55<\/b> (julio 2021): paquete de la Comisión Europea para reducir las emisiones al menos un <b>55 % para 2030<\/b>.<\/li><li><b>FuelEU Maritime<\/b> (2023): fija fechas obligatorias, sobre todo para los <b>puertos Core<\/b> de la UE, de suministro de <b>GNL<\/b> y de electricidad en atraque (<b>OPS<\/b>), y limita la intensidad de GEI de la energía de los buques.<\/li><\/ul>"}], "ctx": "1. Introducción \n \n Abanderamiento : al buque se le aplica la legislación del país de su bandera , sobre todo la laboral y la fiscal \n Los países aprueban normativa específica para sus buques: los registros especiales \n \n \n Normativa de la UE : las directivas se trasponen a leyes y reglamentos españoles \n \n 2. Competencia normativa \n 2.1 Constitución de 1978 \n \n \n \n Artículo \n Contenido \n \n \n \n \n Art. 132 \n Son dominio público estatal el MT , la ZEE y la PC \n \n \n Art. 148 \n Las CCAA pueden asumir competencias en puertos sin actividad comercial y en pesca en aguas interiores \n \n \n Art. 149 \n Competencia exclusiva del Estado : régimen aduanero , pesca marítima , marina mercante y abanderamiento , puertos de interés general \n \n \n \n \n La Constitución no dice nada de las aguas interiores \n Términos como \"marina mercante\" o \"actividades comerciales\" se aclaran después en otras leyes \n \n 2.2 Ley de Puertos del Estado y de la Marina Mercante (1992) \n \n Estructura \n Título preliminar → define los términos que faltaban por aclarar \n Títulos I y II → organizan el sistema portuario de interés general \n Título III → organiza la marina mercante \n Título IV → inspección y régimen sancionador \n \n \n Modificada varias veces, sobre todo en materia portuaria \n Texto refundido de 2010 → es la referencia actual \n \n Qué se considera marina mercante \n \n Transporte marítimo \n Ordenación y control de la flota civil española \n Seguridad en la navegación y salvamento marítimo \n Prevención de la contaminación \n Inspección técnica de buques \n Ordenación del tráfico y comunicaciones \n Abanderamiento y registro de buques \n \n Qué NO se considera marina mercante \n \n La flota pesquera : su ordenación, la del sector y su actividad inspectora \n \n 2.3 Ley de Navegación Marítima (2014) \n \n Una parte administrativa y el resto esencialmente derecho mercantil \n \n \n \n \n Ley de Marina Mercante \n Ley de Navegación Marítima \n \n \n \n \n Organiza la actuación del Estado sobre navegación y tráfico marítimo \n Regula la navegación en derecho público y privado \n \n \n Seguridad, ordenación y prevención de la contaminación \n Regula la normativa mercantil del tráfico marítimo \n \n \n \n 3. La administración marítima \n \n Capitanías marítimas , organizadas por provincias marítimas \n Cada provincia se subdivide en distritos marítimos \n \n \n \n 4. Paso por puertos españoles: autoridades y controles \n \n \n \n Autoridad \n Función \n Norma / trámite \n \n \n \n \n Policía Nacional (Comisaría General de Extranjería y Fronteras) \n Control de entrada y salida de personas en buques extranjeros \n Normativa Schengen \n \n \n Aduanas e Impuestos Especiales (AEAT) \n Trámites de entrada/salida de mercancías \n Código Aduanero de la Unión → despacho aduanero \n \n \n Capitanías marítimas \n Autorizan o prohíben la entrada de buques en aguas españolas, sobre todo los extranjeros \n Despacho de buques \n \n \n Sanidad Exterior \n Lucha contra epidemias y control higiénico-sanitario de productos de consumo humano \n Despacho de sanidad \n \n \n \n \n Otros controles : sanidad animal , sanidad vegetal e inspección de farmacia \n \n 5. Regulación europea \n \n \n \n Norma \n Año \n Idea clave \n \n \n \n \n EMSA (Agencia Europea de Seguridad Marítima) \n 2002 \n Lucha contra siniestralidad y contaminación , y después vigilancia de las aguas \n \n \n Ventanilla única marítima \n 2019 \n Despachos uniformes de entrada y salida en puertos UE \n \n \n Directiva 2014/94 \n 2014 \n Combustibles alternativos : puntos de LNG y electricidad en atraque para finales de 2025 \n \n \n Fit for 55 \n 2021 \n Reducir las emisiones un 55 % para 2030 \n \n \n FuelEU Maritime \n 2023 \n Plazos obligatorios de LNG y OPS en los puertos Core de la UE \n \n \n - Bandera = se aplica la ley laboral y fiscal de ese país \n \n \n \n \n - CE 1978 : 132 dominio público · 148 CCAA · 149 competencia exclusiva del Estado \n \n \n \n \n - Ley de 1992 , con texto refundido de 2010 · Ley de Navegación Marítima de 2014 \n \n \n \n \n - La pesca no es marina mercante \n \n \n \n \n - Despachos: aduanero (AEAT) · de buques (Capitanía) · de sanidad (Sanidad Exterior) · fronteras (Policía, Schengen) \n \n \n \n \n - EMSA 2002 · Dir. 2014/94 (LNG + OPS 2025) · Fit for 55 (−55 % en 2030) · FuelEU Maritime 2023\nAMPLIACIÓN DE LAS DIAPOSITIVAS: TRLPEMM : Texto Refundido de la Ley de Puertos del Estado y de la Marina Mercante, Real Decreto Legislativo 2/2011 . Parte de la Ley 27/1992 , que unió puertos y marina mercante y derogó más de 20 leyes, reformada en 1997, 2003 y 2010. \n Sistema portuario : Puertos del Estado y las Autoridades Portuarias gestionan los puertos de interés general. \n Administración marítima : Dirección General de la Marina Mercante, SASEMAR (salvamento) y Capitanías Marítimas. \n Ley 14/2014 de Navegación Marítima : sobre todo derecho mercantil (contratos, fletamento arts. 203–286). En 2024 se tramita una reforma conjunta de ambas leyes. \n EMSA : creada en 2002, sede en Lisboa , tras el Erika y el Prestige . Coordina el Port State Control europeo, vigila vertidos por satélite y gestiona el EMSWe (Reglamento 2019/1239). En España la ventanilla única es DUEPORT . \n Emisiones UE : EU ETS para el transporte marítimo desde 2024 (40 % en 2024, 70 % en 2025, 100 % desde 2026) y FuelEU Maritime (Reglamento 2023/1805) que limita la intensidad de GEI de la energía usada."}, {"id": "t3", "num": "3", "title": "El buque: tipología, diseño, construcción y propulsión", "short": "El buque", "fuente": "Apuntes JH del Tema 3 y de la charla + diapositivas del profesor", "estudio": "<h2>1. Introducción<\/h2>\n<h3>1.1 Definiciones (RAE)<\/h3>\n<ul>\n<li><strong>Embarcación<\/strong> → vehículo que navega por el agua (remo, vela o motor)<\/li>\n<li><strong>Barco<\/strong> → embarcación <strong>grande<\/strong> (<strong>≥ 24 m<\/strong>)<\/li>\n<li><strong>Buque<\/strong> → barco <strong>con cubierta<\/strong>, apto para navegaciones o empresas marítimas importantes<\/li>\n<\/ul>\n<h3>1.2 Partes del buque<\/h3>\n<ul>\n<li><strong>Proa<\/strong> (delante) · <strong>popa<\/strong> (detrás) · <strong>babor<\/strong> (izquierda) · <strong>estribor<\/strong> (derecha), siempre en el sentido de la marcha<\/li>\n<li><strong>Cubiertas<\/strong> → las \"plantas\" horizontales<\/li>\n<li><strong>Mamparos<\/strong> → planos verticales interiores que dan <strong>estanqueidad<\/strong><\/li>\n<li><strong>Bodega<\/strong> → espacio entre mamparos<\/li>\n<li><strong>Escotillas<\/strong> → aberturas en cubierta para cargar las bodegas <strong>en vertical<\/strong><\/li>\n<\/ul>\n<h3>1.3 Flotación y dimensiones<\/h3>\n<ul>\n<li><strong>Plano de flotación<\/strong> → nivel del agua; divide el buque en <strong>obra viva<\/strong> (sumergida) y <strong>obra muerta<\/strong> (fuera del agua)<\/li>\n<li><strong>Línea de flotación<\/strong> → donde ese plano corta el casco<\/li>\n<li><strong>Eslora<\/strong> (largo) · <strong>manga<\/strong> (ancho) · <strong>calado<\/strong> (parte sumergida)<\/li>\n<li><strong>Puntal<\/strong> → de la cubierta a la parte superior de la quilla<\/li>\n<li><strong>Francobordo<\/strong> → de la cubierta a la línea de flotación<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Medida<\/th>\n<th>Qué mide<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>GT<\/strong> (arqueo bruto)<\/td>\n<td><strong>Tamaño (volumen), no peso<\/strong>. Sirve para calcular las <strong>tasas portuarias<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>TPM<\/strong> (peso muerto)<\/td>\n<td><strong>Carga máxima<\/strong> que puede llevar<\/td>\n<\/tr>\n<tr>\n<td><strong>Desplazamiento<\/strong><\/td>\n<td><strong>Peso total<\/strong> del buque, normalmente a plena carga (t)<\/td>\n<\/tr>\n<tr>\n<td><strong>Nudo<\/strong><\/td>\n<td>Unidad de <strong>velocidad<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>1.4 Marcas del buque<\/h3>\n<ul>\n<li><strong>Marca Plimsoll<\/strong>: un <strong>círculo cruzado<\/strong> por una línea horizontal, <strong>dos letras<\/strong> de la <strong>sociedad de clasificación<\/strong> y una <strong>escala<\/strong> con la <strong>flotación máxima<\/strong> según la <strong>estación y la zona<\/strong><\/li>\n<li><strong>Escalas de calado<\/strong>: dan el calado en cada momento; comparando <strong>proa y popa<\/strong> se sabe si el buque va <strong>adrizado<\/strong> (recto)<\/li>\n<\/ul>\n<h3>1.5 Identificación<\/h3>\n<table>\n<thead>\n<tr>\n<th>Elemento<\/th>\n<th>Clave<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Nombre<\/strong><\/td>\n<td>Lo elige y lo <strong>cambia libremente<\/strong> el propietario<\/td>\n<\/tr>\n<tr>\n<td><strong>Bandera<\/strong><\/td>\n<td>Se aplica la <strong>ley del país<\/strong> (el buque es su territorio). <strong>Obligatoria<\/strong>, el propietario puede cambiarla. <strong>Banderas de conveniencia<\/strong> → ventajas fiscales<\/td>\n<\/tr>\n<tr>\n<td><strong>Número IMO<\/strong><\/td>\n<td><strong>7 dígitos<\/strong>, <strong>no cambia nunca<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Distintivo de llamada<\/strong><\/td>\n<td>Letras que identifican al <strong>emisor de radio<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>MMSI<\/strong><\/td>\n<td><strong>9 dígitos<\/strong>, para la <strong>radio digital<\/strong> marítima<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>1.6 Clases de buque<\/h3>\n<ul>\n<li>Cada <strong>proyecto de ingeniería naval<\/strong> que se encarga al astillero es una <strong>clase<\/strong>; los buques de una misma clase son <strong>gemelos<\/strong> (habitual en contenedores, ro-ro, pasaje y graneles)<\/li>\n<\/ul>\n<h3>1.7 Responsables del buque<\/h3>\n<ul>\n<li><strong>Propietario<\/strong> → dueño del buque<\/li>\n<li><strong>Armador<\/strong> → lo pone <strong>en condiciones de navegar<\/strong> (permisos y equipo). Si no es el propietario, lo arrienda en <strong>fletamento a casco desnudo<\/strong><\/li>\n<li><strong>Naviero<\/strong> → lo <strong>explota comercialmente<\/strong>; lo puede recibir desnudo o ya armado<\/li>\n<li><strong>Condominio naval<\/strong> → <strong>copropiedad<\/strong> del buque para explotarlo en el transporte marítimo<\/li>\n<\/ul>\n<h2>2. Tipología de buques<\/h2>\n<p>Tres grandes grupos: <strong>carga<\/strong>, <strong>pasaje<\/strong> y <strong>mixtos<\/strong>.<\/p>\n<h3>2.1 Buques de carga<\/h3>\n<table>\n<thead>\n<tr>\n<th>Tipo<\/th>\n<th>Rasgos clave<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Carga general<\/strong><\/td>\n<td>El <strong>más antiguo<\/strong>. Carga seca variada y cargas de proyecto. <strong>No especializado<\/strong>; puede llevar contenedores pero <strong>no graneles<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Ro-ro<\/strong><\/td>\n<td>Carga que <strong>entra y sale rodando<\/strong> por <strong>rampas<\/strong>, en varias cubiertas. <strong>Puros<\/strong> (solo rodada: car-carriers, train-carriers) o <strong>híbridos<\/strong> (rodada + pasaje). Capacidad en <strong>CEU<\/strong> o <strong>metros lineales<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Portacontenedores<\/strong><\/td>\n<td>Ordinarios o <strong>refrigerados<\/strong>, algunos con <strong>grúas propias<\/strong>. <strong>Celulares<\/strong>: posiciones fijas de los contenedores<\/td>\n<\/tr>\n<tr>\n<td><strong>Graneleros (sólidos)<\/strong><\/td>\n<td>Carbón, cereales… <strong>Una cubierta<\/strong>, <strong>&lt; 30 tripulantes<\/strong>, <strong>lentos y poco maniobrables<\/strong>. Pequeños y medianos (especializados o generales) y grandes (para graneles ligeros o densos)<\/td>\n<\/tr>\n<tr>\n<td><strong>Cisterna<\/strong><\/td>\n<td><strong>Una cubierta<\/strong> con <strong>muchos tanques<\/strong>, carga <strong>peligrosa<\/strong>: petroleros, quimiqueros, gaseros y otros líquidos<\/td>\n<\/tr>\n<tr>\n<td><strong>Multipropósito<\/strong><\/td>\n<td>Casi todas las formas de presentación <strong>salvo granel líquido y ro-ro<\/strong>. <strong>Versátil y económico<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Tamaños de portacontenedores<\/h4>\n<p><strong>Panamax ≈ 4.000 TEU<\/strong> → <strong>Post-Panamax ≈ 5.000<\/strong> → <strong>New Panamax ≈ 14.000<\/strong> → <strong>Malaccamax ≈ 18.000<\/strong> (teórico)<\/p>\n<h4>Buques cisterna: puntos clave<\/h4>\n<ul>\n<li><strong>Gaseros<\/strong><ul>\n<li><strong>GNL<\/strong> → a presión atmosférica y <strong>−162 °C<\/strong>, hasta <strong>130.000–140.000 m³<\/strong><\/li>\n<li><strong>GLP<\/strong> → a <strong>alta presión<\/strong>, en tanques refrigerados total o parcialmente (<strong>−50 °C<\/strong>)<\/li>\n<\/ul>\n<\/li>\n<li><strong>Doble casco obligatorio<\/strong> desde un accidente en <strong>1990<\/strong>, para evitar vertidos<\/li>\n<li><strong>Contención<\/strong>: <strong>tanques esféricos o cilíndricos<\/strong> individuales, o <strong>membrana<\/strong> (solo GNL)<\/li>\n<li><strong>Gasificación (boil-off)<\/strong> → parte de la carga se evapora; se pierde salvo que el buque la use <strong>como combustible<\/strong><\/li>\n<li><strong>Relicuado<\/strong> → cada vez más buques de GNL llevan equipos para <strong>volver a licuar<\/strong> el gas<\/li>\n<\/ul>\n<h3>2.2 Buques de pasaje<\/h3>\n<ul>\n<li><strong>Transatlánticos<\/strong> → <strong>emigración<\/strong> europea, <strong>lujo<\/strong> y <strong>velocidad<\/strong>. Desaparecen con el <strong>avión<\/strong><\/li>\n<li><strong>Especiales (rápidos)<\/strong> → <strong>casco ligero<\/strong> y menos calado, pero <strong>navegan mal con oleaje<\/strong><\/li>\n<\/ul>\n<h3>2.3 Buques mixtos (ferris)<\/h3>\n<ul>\n<li><strong>Ordinario<\/strong> → trayectos cortos, pocas comodidades<\/li>\n<li><strong>Lanzadera<\/strong> → <strong>alta frecuencia<\/strong><\/li>\n<li><strong>Rápido<\/strong><\/li>\n<li><strong>De trenes<\/strong> → limitados por <strong>cotas y pendientes<\/strong><\/li>\n<li><strong>Ferry-crucero<\/strong> → comodidades de crucero; mezcla <strong>pasaje de ocio<\/strong> y <strong>de transporte<\/strong><\/li>\n<li><strong>De transporte interior<\/strong><\/li>\n<\/ul>\n<h2>3. Mercado de navieras<\/h2>\n<table>\n<thead>\n<tr>\n<th>Segmento<\/th>\n<th>Dato clave<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Contenedores<\/strong><\/td>\n<td><strong>7.402 buques<\/strong>, <strong>&gt; 33 M TEU<\/strong>. Las <strong>5 primeras<\/strong> tienen el <strong>45 %<\/strong> de la capacidad y las <strong>10 primeras<\/strong> el <strong>84 %<\/strong> → <strong>oligopolio<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Cisterna<\/strong><\/td>\n<td><strong>Grecia<\/strong> controla el <strong>21 %<\/strong> del tonelaje mundial (5.520 buques) y el <strong>31 %<\/strong> de la flota de <strong>petroleros<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Ro-ro<\/strong><\/td>\n<td>Incendios en <strong>car-carriers<\/strong> por las <strong>baterías de coches eléctricos<\/strong> → algunas empresas <strong>chinas<\/strong> crean <strong>sus propias navieras<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>4. Tendencias (energéticas)<\/h2>\n<ul>\n<li><strong>OPS (Onshore Power Supply)<\/strong> → los buques nuevos se <strong>conectan a la red eléctrica<\/strong> en el atraque y apagan motores, pero <strong>no hay un estándar único<\/strong><\/li>\n<li><strong>Motores duales<\/strong> → funcionan con <strong>combustible convencional y con GNL<\/strong>, con <strong>muchas menos emisiones<\/strong><\/li>\n<\/ul>\n<h2>Charla del Tema 3: el buque como decisión logística<\/h2>\n<h3>1. Evolución histórica<\/h3>\n<ul>\n<li><strong>Antigüedad<\/strong>: casco de <strong>madera<\/strong> y velas cuadradas → <strong>comercio interregional<\/strong><\/li>\n<li><strong>Edad Media<\/strong>: <strong>brújula<\/strong> y primeros buques especializados → viajes más largos<\/li>\n<li><strong>Revolución industrial<\/strong>: <strong>máquina de vapor<\/strong> → el buque ya no depende del viento, es más <strong>regular<\/strong> y aparecen los <strong>primeros liners<\/strong><\/li>\n<li><strong>Siglo XX<\/strong>: <strong>motor diésel<\/strong> y <strong>contenedor<\/strong> → <strong>buques especializados<\/strong><\/li>\n<li><strong>Siglo XXI<\/strong>: motores <strong>más eficientes<\/strong> y <strong>combustibles alternativos<\/strong><\/li>\n<\/ul>\n<h3>2. El buque como decisión logística<\/h3>\n<ul>\n<li>Hay que estimar el <strong>coste de eficiencia logística<\/strong>: depende de la <strong>mercancía, la ruta, el puerto y el servicio<\/strong><\/li>\n<li><strong>Manipulación de carga<\/strong>: portacontenedores con <strong>estiba vertical<\/strong> (menos errores) · ro-ro con <strong>rampas<\/strong> · graneleros con <strong>grúas propias<\/strong><\/li>\n<li><strong>Tiempos en puerto<\/strong>: <strong>escotillas<\/strong> que reducen los ciclos de grúa y <strong>terminales a medida<\/strong> para cruceros<\/li>\n<li><strong>Seguridad<\/strong>: petroleros de <strong>doble casco<\/strong>, <strong>tanques esféricos<\/strong> en gaseros y <strong>estabilizadores<\/strong> en cruceros y ro-ro<\/li>\n<\/ul>\n<h3>3. Contratación y construcción (18–36 meses)<\/h3>\n<ol>\n<li><strong>Firma del contrato<\/strong> → especificaciones y materiales<\/li>\n<li><strong>Corte de acero<\/strong><\/li>\n<li><strong>Colocación de la quilla<\/strong> → empieza el ensamblaje<\/li>\n<li><strong>Montaje de bloques<\/strong> + tuberías, cableado y maquinaria<\/li>\n<li><strong>Botadura<\/strong> → el buque flota por primera vez<\/li>\n<li><strong>Acabados<\/strong> interiores y exteriores<\/li>\n<li><strong>Pruebas de mar<\/strong>, supervisadas por la <strong>sociedad de clasificación<\/strong><\/li>\n<li><strong>Entrega al armador<\/strong> con el <strong>certificado de clase<\/strong><\/li>\n<\/ol>\n<h3>4. Propulsión tradicional<\/h3>\n<ul>\n<li><strong>Motor diésel de 2 tiempos<\/strong>: eficiente en largas distancias<\/li>\n<li><strong>Combustibles<\/strong>: <strong>fuel oil pesado<\/strong> (barato pero muy contaminante) · <strong>marine diesel oil<\/strong> (para zonas con regulación estricta)<\/li>\n<li><strong>Hélices<\/strong>: <strong>paso fijo<\/strong> (económica y fiable) · <strong>paso variable<\/strong> (más eficiente) · <strong>acimutal<\/strong> (orientable, sin timón)<\/li>\n<li><strong>Limitaciones<\/strong>: impacto ambiental, dependencia del combustible, poca flexibilidad y mantenimiento caro<\/li>\n<\/ul>\n<h3>5. Nuevos sistemas de propulsión<\/h3>\n<ul>\n<li><strong>Alternativas<\/strong>: <strong>GNL<\/strong> (menos azufre y partículas), <strong>metanol<\/strong>, <strong>amoníaco<\/strong>, <strong>hidrógeno<\/strong>, <strong>electrificación parcial<\/strong> o <strong>apoyo eólico<\/strong><\/li>\n<li><strong>Desafíos<\/strong>: <strong>coste<\/strong> de los combustibles · poca <strong>infraestructura<\/strong> de suministro · <strong>seguridad<\/strong> (combustibles criogénicos o tóxicos)<\/li>\n<li><strong>Ventajas<\/strong>: <strong>menos emisiones<\/strong>, <strong>cumplimiento de la normativa<\/strong> e <strong>imagen de sostenibilidad<\/strong><\/li>\n<\/ul>", "ideas": "<ul>\n<li><strong>Barco ≥ 24 m<\/strong> · un <strong>buque<\/strong> tiene <strong>cubierta<\/strong><\/li>\n<li><strong>GT = tamaño<\/strong> (tasas portuarias) · <strong>TPM = carga máxima<\/strong> · <strong>desplazamiento = peso total<\/strong><\/li>\n<li><strong>Plimsoll<\/strong> → flotación máxima por estación y zona, con las letras de la sociedad de clasificación<\/li>\n<li><strong>IMO = 7 dígitos<\/strong>, no cambia · <strong>MMSI = 9 dígitos<\/strong> · nombre y bandera <strong>se pueden cambiar<\/strong><\/li>\n<li><strong>Armador<\/strong> (lo prepara para navegar) ≠ <strong>naviero<\/strong> (lo explota) ≠ <strong>propietario<\/strong><\/li>\n<li><strong>Panamax 4.000 · Post 5.000 · New 14.000 · Malaccamax 18.000 TEU<\/strong><\/li>\n<li><strong>GNL a −162 °C<\/strong> · <strong>GLP a −50 °C<\/strong> y presión · <strong>doble casco<\/strong> en cisternas<\/li>\n<li>Contenedores: <strong>top 10 = 84 %<\/strong> → <strong>oligopolio<\/strong> · <strong>Grecia<\/strong> domina los petroleros<\/li>\n<li>Tendencias: <strong>OPS<\/strong> y <strong>motores duales con GNL<\/strong><\/li>\n<li><strong>Vapor<\/strong> → primeros liners · <strong>diésel + contenedor<\/strong> → buques especializados<\/li>\n<li><strong>8 fases<\/strong> de construcción, <strong>18–36 meses<\/strong><\/li>\n<li><strong>HFO<\/strong> barato pero contaminante, <strong>MDO<\/strong> para zonas reguladas<\/li>\n<li>Nuevos combustibles: los retos son <strong>coste, infraestructura y seguridad<\/strong><\/li>\n<\/ul>", "amplia": "\n<ul>\n<li><b>Estructura del casco<\/b>: quilla (columna vertebral), cuadernas (costillas), baos (apoyan cubiertas), roda (proa) y codaste (popa, lleva el timón). Entre cubiertas, los entrepuentes.<\/li>\n<li><b>Calado y francobordo<\/b>: el calado cambia con la carga y la densidad del agua. Francobordo = puntal − calado. La marca Plimsoll tiene líneas TF, F, T, S, W y WNA.<\/li>\n<li><b>GT vs DWT<\/b>: el GT (Convenio de Arqueo 1969, sustituyó al TRB) es adimensional y mide volumen; base de tasas de puertos y canales. El DWT es peso en toneladas.<\/li>\n<li><b>Ejemplo del profesor<\/b>: OceanLease (propietario), MarWave (armador: tripulación y navegabilidad) y CargoWorld (naviero: contratos y cargadores).<\/li>\n<li><b>Doble casco<\/b>: tras el <b>Exxon Valdez<\/b> (1989), la Oil Pollution Act de EE. UU. (1990) lo exige; el <b>Erika<\/b> (1999) y el <b>Prestige<\/b> (2002) aceleraron la retirada de casco sencillo en MARPOL y la UE.<\/li>\n<li><b>Combustibles alternativos<\/b>: GNL (el más extendido, pero fósil y con fugas de metano), metanol (tóxico, menos energía por volumen), hidrógeno (−253 ºC, caro, trayectos cortos), amoníaco (sin carbono pero muy tóxico).<\/li>\n<li><b>EEDI<\/b>: Anexo VI de MARPOL, adoptado en 2011 y obligatorio desde 2013 para buques nuevos: g de CO₂ por tonelada-milla. Se completa con SEEMP, EEXI y CII (2023). Estrategia GEI de la OMI 2023: cero emisiones netas hacia 2050.<\/li>\n<li><b>Tendencias<\/b>: OPS (de 400 V a 11 kV, sin estándar), motores dual fuel, buques \"ready\" para metanol o amoníaco, slow steaming, ventanillas únicas y B/L electrónico.<\/li>\n<\/ul>", "mapa": {"root": "El buque", "ramas": [{"t": "Partes y medidas", "h": ["Proa · popa · babor · estribor", "Mamparos, bodegas, escotillas", "Eslora · manga · calado · puntal · francobordo", "GT tamaño · TPM carga · desplazamiento peso"]}, {"t": "Marcas e identidad", "h": ["Plimsoll: flotación máxima", "IMO 7 dígitos fijo", "MMSI 9 dígitos", "Nombre y bandera cambian"]}, {"t": "Responsables", "h": ["Propietario", "Armador: lo pone a navegar", "Naviero: lo explota", "Condominio naval"]}, {"t": "Tipología", "h": ["Carga general · ro-ro · portacontenedores", "Graneleros · cisterna · multipropósito", "Pasaje y ferris", "Panamax 4.000 → Malaccamax 18.000 TEU", "GNL −162 ºC · GLP −50 ºC"]}, {"t": "Construcción", "h": ["8 fases: contrato → entrega", "Quilla · bloques · botadura · pruebas de mar", "18–36 meses", "Sociedad de clasificación supervisa"]}, {"t": "Propulsión", "h": ["Diésel 2 tiempos · HFO y MDO", "Hélice fija, variable, acimutal", "GNL · metanol · amoníaco · H₂", "Retos: coste, infraestructura, seguridad"]}, {"t": "Mercado y tendencias", "h": ["Top 10 navieras = 84 % → oligopolio", "Grecia lidera petroleros", "OPS y motores duales"]}]}, "banco": [{"id": "B2-1", "src": "Tema 2 · 1", "q": "Define los principales elementos estructurales del casco de un buque.", "a": "\n<ul><li><p><b>Quilla<\/b>: la \"columna vertebral\" del buque, pieza longitudinal en el fondo.<\/p><\/li><li><p><b>Cuadernas<\/b>: \"costillas\" transversales que salen de la quilla y dan forma al casco.<\/p><\/li><li><p><b>Baos<\/b>: piezas que unen los extremos de las cuadernas y sirven de apoyo a las cubiertas.<\/p><\/li><li><p><b>Roda y codaste<\/b>: piezas que cierran la proa y la popa (en el codaste va el timón).<\/p><\/li><li><p><b>Cubiertas<\/b>: plantas horizontales; los espacios entre ellas son los entrepuentes.<\/p><\/li><li><p><b>Mamparos<\/b>: planos verticales interiores que dan estanqueidad y resistencia.<\/p><\/li><li><p><b>Bodegas<\/b>: espacios entre mamparos para la carga, numerados de proa a popa.<\/p><\/li><li><p><b>Escotillas<\/b>: aberturas en cubierta para cargar verticalmente las bodegas.<\/p><\/li><\/ul>\n<p>Orientación: proa (delante), popa (detrás), babor (izquierda) y estribor (derecha) en el sentido de la marcha.<\/p>\n"}, {"id": "B2-2", "src": "Tema 2 · 2", "q": "Explica los conceptos de obra viva, obra muerta, francobordo y calado.", "a": "\n<p>El plano de flotación (nivel del agua) divide el buque en dos partes:<\/p>\n<ul><li><p><b>Obra viva o carena<\/b>: parte sumergida.<\/p><\/li><li><p><b>Obra muerta<\/b>: parte emergida, por encima de la flotación.<\/p><\/li><li><p><b>Calado<\/b>: profundidad de la parte sumergida (de la quilla a la flotación). Cambia con la carga y con la densidad del agua (temperatura y salinidad). El calado máximo es el de máxima carga.<\/p><\/li><li><p><b>Francobordo<\/b>: distancia entre la cubierta y la flotación, es decir, puntal menos calado. Es el resguardo de seguridad frente a balanceos y oleaje.<\/p><\/li><\/ul>\n<p>Se controlan con la marca Plimsoll (líneas TF, F, T, S, W, WNA según agua dulce/salada, estación y zona) y con las escalas de calado de proa, popa y centro, que indican el asiento y las deformaciones del casco (arrufo y quebranto).<\/p>\n"}, {"id": "B2-3", "src": "Tema 2 · 3", "q": "Compara el arqueo bruto (GT) y el peso muerto (DWT).", "a": "\n<table><tr><th><\/th><th><p>GT (Gross Tonnage)<\/p><\/th><th><p>DWT / TPM (peso muerto)<\/p><\/th><\/tr><tr><td><p>Qué mide<\/p><\/td><td><p>Tamaño o volumen interior (≈ volumen en m³ × 0,3)<\/p><\/td><td><p>Peso que puede cargar: carga, combustible, agua, provisiones<\/p><\/td><\/tr><tr><td><p>Unidad<\/p><\/td><td><p>Adimensional (convenio)<\/p><\/td><td><p>Toneladas<\/p><\/td><\/tr><tr><td><p>Norma<\/p><\/td><td><p>Convenio de Arqueo 1969 (sustituyó al TRB)<\/p><\/td><td><p>Marca Plimsoll (DWT \"summer\")<\/p><\/td><\/tr><tr><td><p>Uso<\/p><\/td><td><p>Base de las tasas portuarias y de canales en todo el mundo<\/p><\/td><td><p>Capacidad comercial de carga, fletes de graneleros y petroleros<\/p><\/td><\/tr><tr><td><p>Ejemplo<\/p><\/td><td><p>Ever Given: 220.940 GT<\/p><\/td><td><p>Pacific Flourish: 399.000 DWT<\/p><\/td><\/tr><\/table>\n<p>Idea clave: el GT es tamaño, no peso; el DWT es peso. No confundir con el desplazamiento, que es el peso total del buque cargado.<\/p>\n"}, {"id": "B2-4", "src": "Tema 2 · 4", "q": "Analiza la diferencia entre propietario, armador y naviero.", "a": "\n<ul><li><p><b>Propietario<\/b>: el dueño registral del buque.<\/p><\/li><li><p><b>Armador<\/b>: quien, sea o no propietario, pone el buque en condiciones de navegar: permisos, pertrechos, repuestos y tripulación. Si no es el propietario, lo recibe mediante un fletamento a casco desnudo.<\/p><\/li><li><p><b>Naviero<\/b>: quien explota comercialmente el buque: ofrece servicios, acepta encargos y elige puertos. Puede ser el propietario, recibir el buque desnudo (casco desnudo) o recibirlo armado (fletamento por tiempo).<\/p><\/li><\/ul>\n<p>Ejemplo del profesor: OceanLease (propietario, responsabilidad mínima, registral), MarWave (armador: seguridad, tripulación y navegabilidad) y CargoWorld (naviero: contratos de transporte y relación con los cargadores). Si varios comparten la propiedad para explotarlo hay condominio naval.<\/p>\n"}, {"id": "B2-5", "src": "Tema 2 · 5", "q": "Explica las fases principales en la construcción de un buque mercante.", "a": "\n<ol><li><p><b>Firma del contrato<\/b>: se cierran especificaciones técnicas, arranca el proyecto y el aprovisionamiento de materiales.<\/p><\/li><li><p><b>Corte de acero<\/b>: se cortan las planchas del casco.<\/p><\/li><li><p><b>Colocación de la quilla<\/b>: inicio del ensamblaje en grada o dique.<\/p><\/li><li><p><b>Montaje de bloques<\/b> prefabricados; en paralelo se instalan tuberías, cableado y maquinaria.<\/p><\/li><li><p><b>Botadura<\/b>: el buque flota por primera vez.<\/p><\/li><li><p><b>Armamento o acabado<\/b> exterior e interior: equipos y sistemas.<\/p><\/li><li><p><b>Pruebas de mar<\/b>: ensayos de navegación supervisados por la sociedad de clasificación.<\/p><\/li><li><p><b>Entrega al armador<\/b> con el certificado de clase y la documentación.<\/p><\/li><\/ol>\n<p>Duración habitual: entre 18 y 36 meses. Cada buque es un proyecto individual, aunque hoy se construyen \"clases\" de buques gemelos (4 a 20 unidades).<\/p>\n"}, {"id": "B2-6", "src": "Tema 2 · 6", "q": "Describe la función de la sociedad de clasificación durante la construcción.", "a": "\n<p>La sociedad de clasificación (entidad técnica privada, contratada por el propietario) comprueba que el buque cumple sus reglas y las normas OMI:<\/p>\n<ul><li><p><b>Antes<\/b>: revisa y aprueba los planos y el proyecto.<\/p><\/li><li><p><b>Durante<\/b>: inspecciona materiales, soldaduras y montaje, y que se usan tecnologías constructivas adecuadas.<\/p><\/li><li><p><b>Al final<\/b>: supervisa las pruebas de mar y emite el <b>certificado de clase<\/b>.<\/p><\/li><li><p>Por delegación de la bandera: mide el arqueo, fija las líneas de carga (Plimsoll, donde figuran sus siglas, p. ej. LR) y certifica SOLAS y MARPOL.<\/p><\/li><\/ul>\n<p>Clasificar no es obligatorio, pero lo exigen las aseguradoras. Ejemplos (IACS): Lloyd's Register, Bureau Veritas, DNV, ABS, RINA, ClassNK.<\/p>\n"}, {"id": "B2-7", "src": "Tema 2 · 7", "q": "Compara un portacontenedores y un granelero en diseño y operación.", "a": "\n<table><tr><th><\/th><th><p>Portacontenedores<\/p><\/th><th><p>Granelero<\/p><\/th><\/tr><tr><td><p>Carga<\/p><\/td><td><p>Contenedores (TEU)<\/p><\/td><td><p>Graneles secos: mineral, carbón, cereal<\/p><\/td><\/tr><tr><td><p>Diseño<\/p><\/td><td><p>Bodegas celulares con guías, apilado en cubierta, escotillas anchas<\/p><\/td><td><p>Cubierta única, grandes bodegas y escotillas; en minerales densos, huecos o lastre<\/p><\/td><\/tr><tr><td><p>Grúas<\/p><\/td><td><p>Normalmente usa las del muelle (los grandes nunca llevan)<\/p><\/td><td><p>Los pequeños y medianos pueden llevar propias<\/p><\/td><\/tr><tr><td><p>Velocidad<\/p><\/td><td><p>19–26 nudos<\/p><\/td><td><p>Lentos (≈ 14–15 nudos) y poco maniobrables<\/p><\/td><\/tr><tr><td><p>Servicio<\/p><\/td><td><p>Línea regular (liner), B/L<\/p><\/td><td><p>Tramp, póliza de fletamento<\/p><\/td><\/tr><tr><td><p>Mayores<\/p><\/td><td><p>MSC Irina: 24.346 TEU, 400 m<\/p><\/td><td><p>Valemax: 399.000 DWT, 362 m<\/p><\/td><\/tr><\/table>\n"}, {"id": "B2-8", "src": "Tema 2 · 8", "q": "Analiza el papel del doble casco en la seguridad marítima.", "a": "\n<p>El doble casco añade un segundo forro separado del exterior, de modo que un choque o varada no perfora directamente los tanques de carga. Su objetivo es evitar vertidos.<\/p>\n<ul><li><p>Surge tras el Exxon Valdez (1989, 37.000 t de crudo en Alaska): la Oil Pollution Act de EE. UU. (1990) lo exigió a todos los petroleros.<\/p><\/li><li><p>El Erika (1999, Bretaña) y el Prestige (2002, Galicia) aceleraron su exigencia internacional: MARPOL (OMI) y la UE adelantaron la retirada de los petroleros de casco sencillo.<\/p><\/li><li><p>Hoy es obligatorio en los buques cisterna. Los gaseros usan además tanques esféricos o de membrana aislados.<\/p><\/li><\/ul>\n<p>Limitación: reduce mucho el riesgo, pero no lo elimina, y exige vigilar la corrosión de los espacios entre cascos.<\/p>\n"}, {"id": "B2-9", "src": "Tema 2 · 9", "q": "Explica los retos del uso de combustibles alternativos (GNL, metanol, hidrógeno).", "a": "\n<ul><li><p><b>GNL<\/b>: casi sin azufre ni partículas y menos CO₂, pero es fósil, criogénico (–162 ºC) y tiene fugas de metano (methane slip). Es el más extendido (motores dual fuel).<\/p><\/li><li><p><b>Metanol<\/b>: líquido a temperatura ambiente y fácil de manejar, pero tóxico, con menos energía por volumen (más tanques) y poco metanol verde disponible.<\/p><\/li><li><p><b>Hidrógeno<\/b>: cero CO₂ en uso, pero muy difícil de almacenar (–253 ºC o alta presión), muy inflamable y caro. Por ahora solo para trayectos cortos.<\/p><\/li><li><p>(Amoníaco: sin carbono, pero muy tóxico.)<\/p><\/li><\/ul>\n<p>Retos comunes:<\/p>\n<ul><li><p><b>Costes<\/b>: combustibles y motores más caros.<\/p><\/li><li><p><b>Infraestructura<\/b>: escaso suministro (bunkering) en los puertos.<\/p><\/li><li><p><b>Seguridad<\/b>: productos criogénicos, tóxicos o inflamables; nueva formación de tripulaciones.<\/p><\/li><\/ul>\n<p>Ventajas: menos emisiones, cumplimiento normativo (IMO, EU ETS, FuelEU) e imagen sostenible. Por eso muchos buques salen \"dual fuel\" o \"methanol/ammonia‑ready\".<\/p>\n"}, {"id": "B2-10", "src": "Tema 2 · 10", "q": "Resume las tendencias actuales en sostenibilidad y digitalización marítima.", "a": "\n<p><b>Sostenibilidad<\/b><\/p>\n<ul><li><p>OPS (Onshore Power Supply): el buque atracado se conecta a la red del puerto y apaga los motores auxiliares (en la UE para 2030; sin estándar único, de 400 V a 11.000 V).<\/p><\/li><li><p>Motores dual fuel y buques \"ready\" para amoníaco o metanol; apoyo eólico y electrificación parcial.<\/p><\/li><li><p>Menor velocidad de diseño (slow steaming) y mejoras hidrodinámicas.<\/p><\/li><li><p>Marco normativo: IMO 2020 (azufre 0,5 %), EEDI/SEEMP, estrategia GEI de la OMI, EU ETS y FuelEU Maritime.<\/p><\/li><\/ul>\n<p><b>Digitalización<\/b><\/p>\n<ul><li><p>Ventanillas únicas (EMSWe en la UE, DUEPORT en España) y formularios FAL digitales.<\/p><\/li><li><p>Conocimiento de embarque electrónico.<\/p><\/li><li><p>Smart containers, seguimiento por AIS e IoT, y planes de estiba informatizados.<\/p><\/li><\/ul>\n"}, {"id": "B2-11", "src": "Tema 2 · 11", "q": "Explica las nuevas iniciativas en materia de reducción de emisiones EEDI", "a": "\n<ul><li><p><b>EEDI<\/b> (Energy Efficiency Design Index): adoptado en 2011 en el Anexo VI de MARPOL y obligatorio desde 2013 para buques nuevos. Fija un máximo de gramos de CO₂ por tonelada‑milla transportada; cuanto más bajo, más eficiente. Se endurece por fases e impulsa motores eficientes, mejoras hidrodinámicas y apoyo eólico.<\/p><\/li><li><p><b>SEEMP<\/b>: plan de gestión de la eficiencia energética, obligatorio para todos los buques. Desde 2023 se completan con el EEXI (buques existentes) y el CII (indicador operativo anual).<\/p><\/li><li><p><b>Estrategia GEI de la OMI<\/b>: la inicial de 2018 fijaba reducir un 50 % en 2050 respecto a 2008; la revisión de 2023 sube la meta a cero emisiones netas hacia 2050.<\/p><\/li><li><p><b>UE<\/b>: el EU ETS obliga desde 2024 a comprar derechos por el CO₂ emitido (40 % en 2024, 70 % en 2025 y 100 % desde 2026), y FuelEU Maritime limita la intensidad de GEI de la energía usada.<\/p><\/li><\/ul>\n<p>En resumen: el EEDI regula la eficiencia del diseño y el ETS pone precio a las emisiones de la operación.<\/p>\n"}], "propias": [{"id": "t3-c1", "q": "Diferencia entre embarcación, barco y buque.", "a": "<ul><li><b>Embarcación<\/b>: vehículo que navega por el agua, a remo, vela o motor.<\/li><li><b>Barco<\/b>: embarcación de grandes dimensiones (a partir de <b>24 m<\/b>).<\/li><li><b>Buque<\/b>: barco <b>con cubierta<\/b>, apto para navegaciones o empresas marítimas importantes.<\/li><\/ul>"}, {"id": "t3-c2", "q": "¿Qué es la marca Plimsoll y qué información da?", "a": "<p>Es la marca pintada en el costado para controlar el <b>calado máximo<\/b>. Tiene:<\/p><ul><li>Un <b>círculo<\/b> atravesado por una línea horizontal.<\/li><li><b>Dos letras<\/b> de la sociedad de clasificación.<\/li><li>Una <b>escala<\/b> con las líneas de flotación máxima según <b>estación y zona<\/b> (TF, F, T, S, W, WNA).<\/li><\/ul><p>Se complementa con las escalas de calado de proa y popa.<\/p>"}, {"id": "t3-c3", "q": "Explica los elementos de identificación de un buque e indica cuáles pueden cambiar.", "a": "<ul><li><b>Nombre<\/b>: lo elige y cambia el propietario.<\/li><li><b>Bandera<\/b>: obligatoria; aplica la ley de ese país; se puede cambiar (banderas de conveniencia).<\/li><li><b>Número IMO<\/b>: 7 dígitos, <b>no cambia nunca<\/b>.<\/li><li><b>Distintivo de llamada<\/b>: letras del emisor de radio.<\/li><li><b>MMSI<\/b>: 9 dígitos para la radio digital marítima.<\/li><\/ul>"}, {"id": "t3-c4", "q": "Ordena por tamaño los portacontenedores Panamax, New Panamax, Post-Panamax y Malaccamax con su capacidad aproximada.", "a": "<p><b>Panamax ≈ 4.000 TEU<\/b> → <b>Post-Panamax ≈ 5.000 TEU<\/b> → <b>New Panamax ≈ 14.000 TEU<\/b> → <b>Malaccamax ≈ 18.000 TEU<\/b> (teórico, el máximo que cabría por el estrecho de Malaca).<\/p>"}, {"id": "t3-c5", "q": "Compara los gaseros de GNL y de GLP.", "a": "<ul><li><b>GNL<\/b>: gas natural licuado a <b>presión atmosférica<\/b> y <b>−162 ºC<\/b>; capacidades de 130.000–140.000 m³; tanques esféricos o de <b>membrana<\/b>.<\/li><li><b>GLP<\/b>: gases licuados del petróleo a <b>alta presión<\/b>, en tanques total o parcialmente refrigerados (<b>−50 ºC<\/b>).<\/li><\/ul><p>En ambos hay gasificación (boil-off), que puede usarse como combustible o relicuarse.<\/p>"}, {"id": "t3-c6", "q": "¿Qué son la gasificación y el relicuado en un buque de GNL?", "a": "<p>La <b>gasificación<\/b> (boil-off) es la ebullición natural de parte de la carga, que se convierte en gas; se perdería salvo que el buque esté diseñado para <b>quemarla como combustible<\/b>. El <b>relicuado<\/b> es el equipo, cada vez más habitual, que <b>vuelve a licuar<\/b> ese gas y lo devuelve a los tanques.<\/p>"}, {"id": "t3-c7", "q": "Explica los tipos de buque ro-ro y cómo se mide su capacidad.", "a": "<p>Transportan carga que <b>entra y sale rodando<\/b> por <b>rampas<\/b>, en varias cubiertas.<\/p><ul><li><b>Puros<\/b>: solo carga rodada (ordinarios, car-carriers, train-carriers).<\/li><li><b>Híbridos<\/b>: carga rodada y pasaje.<\/li><\/ul><p>La capacidad se mide en <b>CEU<\/b> (coches) o <b>metros lineales<\/b>.<\/p>"}, {"id": "t3-c8", "q": "Describe los tipos de hélice usados en buques mercantes.", "a": "<ul><li><b>Paso fijo<\/b>: económica y muy fiable.<\/li><li><b>Paso variable<\/b>: se ajusta el ángulo de las palas; más eficiente.<\/li><li><b>Propulsores acimutales<\/b>: orientables, no necesitan timón y dan gran maniobrabilidad.<\/li><\/ul>"}, {"id": "t3-c9", "q": "¿Qué indican los datos del mercado de navieras de contenedores?", "a": "<p>Hay unos <b>7.402 buques<\/b> con más de <b>33 millones de TEU<\/b>. Las <b>5 primeras<\/b> navieras tienen el <b>45 %<\/b> de la capacidad y las <b>10 primeras<\/b> el <b>84 %<\/b>: el mercado es un <b>oligopolio<\/b>.<\/p>"}, {"id": "t3-c10", "q": "Resume la evolución histórica del buque mercante.", "a": "<ul><li><b>Antigüedad<\/b>: madera y velas → comercio interregional.<\/li><li><b>Edad Media<\/b>: brújula y buques especializados.<\/li><li><b>Descubrimientos<\/b>: nuevas tipologías y cartografía.<\/li><li><b>Revolución industrial<\/b>: vapor → regularidad, primeros <b>liners<\/b>.<\/li><li><b>Siglo XX<\/b>: diésel y <b>contenedor<\/b> → buques especializados.<\/li><li><b>Siglo XXI<\/b>: eficiencia y combustibles alternativos.<\/li><\/ul>"}], "ctx": "1. Introducción \n 1.1 Definiciones (RAE) \n \n Embarcación → vehículo que navega por el agua (remo, vela o motor) \n Barco → embarcación grande ( ≥ 24 m ) \n Buque → barco con cubierta , apto para navegaciones o empresas marítimas importantes \n \n 1.2 Partes del buque \n \n Proa (delante) · popa (detrás) · babor (izquierda) · estribor (derecha), siempre en el sentido de la marcha \n Cubiertas → las \"plantas\" horizontales \n Mamparos → planos verticales interiores que dan estanqueidad \n Bodega → espacio entre mamparos \n Escotillas → aberturas en cubierta para cargar las bodegas en vertical \n \n 1.3 Flotación y dimensiones \n \n Plano de flotación → nivel del agua; divide el buque en obra viva (sumergida) y obra muerta (fuera del agua) \n Línea de flotación → donde ese plano corta el casco \n Eslora (largo) · manga (ancho) · calado (parte sumergida) \n Puntal → de la cubierta a la parte superior de la quilla \n Francobordo → de la cubierta a la línea de flotación \n \n \n \n \n Medida \n Qué mide \n \n \n \n \n GT (arqueo bruto) \n Tamaño (volumen), no peso . Sirve para calcular las tasas portuarias \n \n \n TPM (peso muerto) \n Carga máxima que puede llevar \n \n \n Desplazamiento \n Peso total del buque, normalmente a plena carga (t) \n \n \n Nudo \n Unidad de velocidad \n \n \n \n 1.4 Marcas del buque \n \n Marca Plimsoll : un círculo cruzado por una línea horizontal, dos letras de la sociedad de clasificación y una escala con la flotación máxima según la estación y la zona \n Escalas de calado : dan el calado en cada momento; comparando proa y popa se sabe si el buque va adrizado (recto) \n \n 1.5 Identificación \n \n \n \n Elemento \n Clave \n \n \n \n \n Nombre \n Lo elige y lo cambia libremente el propietario \n \n \n Bandera \n Se aplica la ley del país (el buque es su territorio). Obligatoria , el propietario puede cambiarla. Banderas de conveniencia → ventajas fiscales \n \n \n Número IMO \n 7 dígitos , no cambia nunca \n \n \n Distintivo de llamada \n Letras que identifican al emisor de radio \n \n \n MMSI \n 9 dígitos , para la radio digital marítima \n \n \n \n 1.6 Clases de buque \n \n Cada proyecto de ingeniería naval que se encarga al astillero es una clase ; los buques de una misma clase son gemelos (habitual en contenedores, ro-ro, pasaje y graneles) \n \n 1.7 Responsables del buque \n \n Propietario → dueño del buque \n Armador → lo pone en condiciones de navegar (permisos y equipo). Si no es el propietario, lo arrienda en fletamento a casco desnudo \n Naviero → lo explota comercialmente ; lo puede recibir desnudo o ya armado \n Condominio naval → copropiedad del buque para explotarlo en el transporte marítimo \n \n 2. Tipología de buques \n Tres grandes grupos: carga , pasaje y mixtos . \n 2.1 Buques de carga \n \n \n \n Tipo \n Rasgos clave \n \n \n \n \n Carga general \n El más antiguo . Carga seca variada y cargas de proyecto. No especializado ; puede llevar contenedores pero no graneles \n \n \n Ro-ro \n Carga que entra y sale rodando por rampas , en varias cubiertas. Puros (solo rodada: car-carriers, train-carriers) o híbridos (rodada + pasaje). Capacidad en CEU o metros lineales \n \n \n Portacontenedores \n Ordinarios o refrigerados , algunos con grúas propias . Celulares : posiciones fijas de los contenedores \n \n \n Graneleros (sólidos) \n Carbón, cereales… Una cubierta , < 30 tripulantes , lentos y poco maniobrables . Pequeños y medianos (especializados o generales) y grandes (para graneles ligeros o densos) \n \n \n Cisterna \n Una cubierta con muchos tanques , carga peligrosa : petroleros, quimiqueros, gaseros y otros líquidos \n \n \n Multipropósito \n Casi todas las formas de presentación salvo granel líquido y ro-ro . Versátil y económico \n \n \n \n Tamaños de portacontenedores \n Panamax ≈ 4.000 TEU → Post-Panamax ≈ 5.000 → New Panamax ≈ 14.000 → Malaccamax ≈ 18.000 (teórico) \n Buques cisterna: puntos clave \n \n Gaseros \n GNL → a presión atmosférica y −162 °C , hasta 130.000–140.000 m³ \n GLP → a alta presión , en tanques refrigerados total o parcialmente ( −50 °C ) \n \n \n Doble casco obligatorio desde un accidente en 1990 , para evitar vertidos \n Contención : tanques esféricos o cilíndricos individuales, o membrana (solo GNL) \n Gasificación (boil-off) → parte de la carga se evapora; se pierde salvo que el buque la use como combustible \n Relicuado → cada vez más buques de GNL llevan equipos para volver a licuar el gas \n \n 2.2 Buques de pasaje \n \n Transatlánticos → emigración europea, lujo y velocidad . Desaparecen con el avión \n Especiales (rápidos) → casco ligero y menos calado, pero navegan mal con oleaje \n \n 2.3 Buques mixtos (ferris) \n \n Ordinario → trayectos cortos, pocas comodidades \n Lanzadera → alta frecuencia \n Rápido \n De trenes → limitados por cotas y pendientes \n Ferry-crucero → comodidades de crucero; mezcla pasaje de ocio y de transporte \n De transporte interior \n \n 3. Mercado de navieras \n \n \n \n Segmento \n Dato clave \n \n \n \n \n Contenedores \n 7.402 buques , > 33 M TEU . Las 5 primeras tienen el 45 % de la capacidad y las 10 primeras el 84 % → oligopolio \n \n \n Cisterna \n Grecia controla el 21 % del tonelaje mundial (5.520 buques) y el 31 % de la flota de petroleros \n \n \n Ro-ro \n Incendios en car-carriers por las baterías de coches eléctricos → algunas empresas chinas crean sus propias navieras \n \n \n \n 4. Tendencias (energéticas) \n \n OPS (Onshore Power Supply) → los buques nuevos se conectan a la red eléctrica en el atraque y apagan motores, pero no hay un estándar único \n Motores duales → funcionan con combustible convencional y con GNL , con muchas menos emisiones \n \n Charla del Tema 3: el buque como decisión logística \n 1. Evolución histórica \n \n Antigüedad : casco de madera y velas cuadradas → comercio interregional \n Edad Media : brújula y primeros buques especializados → viajes más largos \n Revolución industrial : máquina de vapor → el buque ya no depende del viento, es más regular y aparecen los primeros liners \n Siglo XX : motor diésel y contenedor → buques especializados \n Siglo XXI : motores más eficientes y combustibles alternativos \n \n 2. El buque como decisión logística \n \n Hay que estimar el coste de eficiencia logística : depende de la mercancía, la ruta, el puerto y el servicio \n Manipulación de carga : portacontenedores con estiba vertical (menos errores) · ro-ro con rampas · graneleros con grúas propias \n Tiempos en puerto : escotillas que reducen los ciclos de grúa y terminales a medida para cruceros \n Seguridad : petroleros de doble casco , tanques esféricos en gaseros y estabilizadores en cruceros y ro-ro \n \n 3. Contratación y construcción (18–36 meses) \n \n Firma del contrato → especificaciones y materiales \n Corte de acero \n Colocación de la quilla → empieza el ensamblaje \n Montaje de bloques + tuberías, cableado y maquinaria \n Botadura → el buque flota por primera vez \n Acabados interiores y exteriores \n Pruebas de mar , supervisadas por la sociedad de clasificación \n Entrega al armador con el certificado de clase \n \n 4. Propulsión tradicional \n \n Motor diésel de 2 tiempos : eficiente en largas distancias \n Combustibles : fuel oil pesado (barato pero muy contaminante) · marine diesel oil (para zonas con regulación estricta) \n Hélices : paso fijo (económica y fiable) · paso variable (más eficiente) · acimutal (orientable, sin timón) \n Limitaciones : impacto ambiental, dependencia del combustible, poca flexibilidad y mantenimiento caro \n \n 5. Nuevos sistemas de propulsión \n \n Alternativas : GNL (menos azufre y partículas), metanol , amoníaco , hidrógeno , electrificación parcial o apoyo eólico \n Desafíos : coste de los combustibles · poca infraestructura de suministro · seguridad (combustibles criogénicos o tóxicos) \n Ventajas : menos emisiones , cumplimiento de la normativa e imagen de sostenibilidad \n Barco ≥ 24 m · un buque tiene cubierta \n GT = tamaño (tasas portuarias) · TPM = carga máxima · desplazamiento = peso total \n Plimsoll → flotación máxima por estación y zona, con las letras de la sociedad de clasificación \n IMO = 7 dígitos , no cambia · MMSI = 9 dígitos · nombre y bandera se pueden cambiar \n Armador (lo prepara para navegar) ≠ naviero (lo explota) ≠ propietario \n Panamax 4.000 · Post 5.000 · New 14.000 · Malaccamax 18.000 TEU \n GNL a −162 °C · GLP a −50 °C y presión · doble casco en cisternas \n Contenedores: top 10 = 84 % → oligopolio · Grecia domina los petroleros \n Tendencias: OPS y motores duales con GNL \n Vapor → primeros liners · diésel + contenedor → buques especializados \n 8 fases de construcción, 18–36 meses \n HFO barato pero contaminante, MDO para zonas reguladas \n Nuevos combustibles: los retos son coste, infraestructura y seguridad\nAMPLIACIÓN DE LAS DIAPOSITIVAS: Estructura del casco : quilla (columna vertebral), cuadernas (costillas), baos (apoyan cubiertas), roda (proa) y codaste (popa, lleva el timón). Entre cubiertas, los entrepuentes. \n Calado y francobordo : el calado cambia con la carga y la densidad del agua. Francobordo = puntal − calado. La marca Plimsoll tiene líneas TF, F, T, S, W y WNA. \n GT vs DWT : el GT (Convenio de Arqueo 1969, sustituyó al TRB) es adimensional y mide volumen; base de tasas de puertos y canales. El DWT es peso en toneladas. \n Ejemplo del profesor : OceanLease (propietario), MarWave (armador: tripulación y navegabilidad) y CargoWorld (naviero: contratos y cargadores). \n Doble casco : tras el Exxon Valdez (1989), la Oil Pollution Act de EE. UU. (1990) lo exige; el Erika (1999) y el Prestige (2002) aceleraron la retirada de casco sencillo en MARPOL y la UE. \n Combustibles alternativos : GNL (el más extendido, pero fósil y con fugas de metano), metanol (tóxico, menos energía por volumen), hidrógeno (−253 ºC, caro, trayectos cortos), amoníaco (sin carbono pero muy tóxico). \n EEDI : Anexo VI de MARPOL, adoptado en 2011 y obligatorio desde 2013 para buques nuevos: g de CO₂ por tonelada-milla. Se completa con SEEMP, EEXI y CII (2023). Estrategia GEI de la OMI 2023: cero emisiones netas hacia 2050. \n Tendencias : OPS (de 400 V a 11 kV, sin estándar), motores dual fuel, buques \"ready\" para metanol o amoníaco, slow steaming, ventanillas únicas y B/L electrónico."}, {"id": "t5", "num": "5", "title": "Contratos de transporte marítimo", "short": "Contratos", "fuente": "Apuntes JH del Tema 5 + diapositivas del profesor", "estudio": "<h2>1. Contrato de fletamento<\/h2>\n<ul>\n<li>El <strong>porteador<\/strong> se obliga a <strong>transportar mercancías por mar<\/strong> y <strong>entregarlas en destino<\/strong> a cambio de un <strong>precio (flete)<\/strong><\/li>\n<\/ul>\n<h3>1.1 Clases<\/h3>\n<ul>\n<li><strong>A casco desnudo<\/strong> → el fletante entrega el buque <strong>navegable<\/strong> pero <strong>sin tripulación ni pertrechos<\/strong><\/li>\n<li><strong>Total<\/strong> → el fletador dispone de <strong>todo el buque<\/strong><\/li>\n<li><strong>Parcial<\/strong> → el fletador solo dispone de <strong>un espacio<\/strong> del buque<\/li>\n<\/ul>\n<h3>1.2 Modalidades<\/h3>\n<table>\n<thead>\n<tr>\n<th><strong>Por tiempo<\/strong><\/th>\n<th><strong>Por viaje<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>El porteador hace <strong>todos los viajes que ordene el fletador<\/strong> durante el <strong>periodo pactado<\/strong><\/td>\n<td>El porteador hace <strong>los viajes acordados<\/strong><\/td>\n<\/tr>\n<tr>\n<td>El <strong>fletador lleva la gestión comercial<\/strong> del buque<\/td>\n<td>El flete se paga <strong>por viaje<\/strong> o <strong>por carga transportada<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>1.3 Otras figuras<\/h3>\n<ul>\n<li><strong>Subrogación<\/strong> → el fletador puede ceder sus derechos y obligaciones a un <strong>tercero<\/strong> (subfletamento)<\/li>\n<li><strong>Contratación por el fletador<\/strong> → puede firmar en su nombre contratos con terceros en <strong>régimen de conocimiento de embarque<\/strong>; <strong>porteador y fletador responden<\/strong> frente a esos terceros por daños a la mercancía<\/li>\n<li><strong>Contratos de volumen<\/strong> → un conjunto de mercancías en <strong>varios buques o varios viajes<\/strong><\/li>\n<\/ul>\n<h2>2. Elementos del fletamento<\/h2>\n<h3>2.1 Personales<\/h3>\n<ul>\n<li><strong>Shipper (cargador)<\/strong> → <strong>entrega la mercancía<\/strong> para el transporte a su <strong>coste y riesgo<\/strong>; puede ser o no el fletador<\/li>\n<li><strong>Fletante (porteador)<\/strong> → <strong>realiza el transporte<\/strong><\/li>\n<li><strong>Fletador<\/strong> → <strong>contrata<\/strong> el transporte y <strong>paga el flete<\/strong><\/li>\n<li><strong>Consignee (receptor)<\/strong> → recibe la mercancía; puede tener que <strong>desestibar y descargar<\/strong> a su coste y riesgo<\/li>\n<li><strong>Capitán<\/strong> → <strong>máxima autoridad<\/strong> a bordo<\/li>\n<li><strong>Agente de fletamentos<\/strong> → <strong>intermediario<\/strong> en la contratación<\/li>\n<\/ul>\n<h3>2.2 Reales<\/h3>\n<ul>\n<li><strong>Buque<\/strong> → si el contrato lo designa, <strong>no se puede sustituir<\/strong>; debe estar en <strong>estado de navegabilidad<\/strong><\/li>\n<li><strong>Flete<\/strong> → precio pactado, por <strong>peso, volumen o tiempo<\/strong><\/li>\n<li><strong>Mercancías<\/strong> → lo que se transporta y se debe entregar<\/li>\n<\/ul>\n<h3>2.3 Formales<\/h3>\n<ul>\n<li><strong>Póliza de fletamento<\/strong> → <strong>formaliza<\/strong> el contrato y fija sus <strong>términos<\/strong><\/li>\n<li><strong>Conocimiento de embarque (B/L)<\/strong> → <strong>prueba<\/strong> el contrato y es <strong>recibo<\/strong> y <strong>título de propiedad<\/strong> de la mercancía<\/li>\n<\/ul>\n<h2>3. Obligaciones de las partes<\/h2>\n<h3>3.1 Del fletante (porteador)<\/h3>\n<ul>\n<li><strong>Poner el buque a disposición<\/strong> en el puerto<\/li>\n<li>Garantizar la <strong>navegabilidad<\/strong><\/li>\n<li>Cumplir las <strong>características pactadas<\/strong> (bandera, clasificación, velocidad…)<\/li>\n<li><strong>Carga, descarga, estiba y desestiba<\/strong> → cuando el régimen es de <strong>conocimiento de embarque<\/strong><\/li>\n<li><strong>Hacer el viaje<\/strong> sin demoras y <strong>por la ruta pactada<\/strong><\/li>\n<li><strong>Desviación<\/strong> → responde de los daños, <strong>salvo<\/strong> que sea para <strong>salvar vidas<\/strong> u otra causa justificada<\/li>\n<li><strong>Custodia<\/strong> → responde de la <strong>pérdida o daño<\/strong> de la mercancía<\/li>\n<li><strong>Entrega<\/strong> sin demora y según lo pactado en destino<\/li>\n<li><strong>Si hay avería<\/strong>: custodia la mercancía mientras se repara; si el buque queda <strong>inútil definitivamente<\/strong>, debe <strong>buscar otro transporte<\/strong> hasta el destino<\/li>\n<\/ul>\n<h3>3.2 Del fletador<\/h3>\n<ul>\n<li><strong>Presentar la mercancía al costado del buque<\/strong>; si no lo hace, el contrato <strong>puede resolverse<\/strong><\/li>\n<li><strong>No embarcar mercancía distinta<\/strong> a la contratada (embarque clandestino), salvo que no cause perjuicio<\/li>\n<li><strong>No embarcar mercancía peligrosa sin declararla<\/strong><\/li>\n<li><strong>Pagar el flete<\/strong><ul>\n<li><strong>Flete sobre vacío<\/strong> → si carga menos de lo contratado, <strong>paga también lo no embarcado<\/strong><\/li>\n<li><strong>Mercancía perdida en el viaje<\/strong> → <strong>no paga flete<\/strong><\/li>\n<li><strong>Privilegio del crédito<\/strong> → la mercancía responde del <strong>flete, demoras y gastos<\/strong> hasta la entrega y <strong>15 días después<\/strong> (salvo que se haya transmitido el título)<\/li>\n<li><strong>Retención y depósito<\/strong> → el porteador puede <strong>retener la mercancía<\/strong> hasta cobrar<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>3.3 Tiempos de carga y descarga<\/h3>\n<table>\n<thead>\n<tr>\n<th>Periodo<\/th>\n<th>Qué es<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Plancha<\/strong><\/td>\n<td>Tiempo <strong>incluido<\/strong> para cargar o descargar. Empieza cuando el buque está <strong>en muelle, listo<\/strong> y el fletador ha sido <strong>avisado<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Demoras<\/strong><\/td>\n<td>Empiezan <strong>al acabar la plancha<\/strong> sin terminar las operaciones. El fletador paga la <strong>cantidad pactada<\/strong>; la duración la fija la <strong>póliza<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Detención ulterior<\/strong><\/td>\n<td>Tras <strong>agotar las demoras<\/strong>, el porteador puede reclamar <strong>indemnización<\/strong> por los perjuicios<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>4. Conocimiento de embarque (B/L)<\/h2>\n<h3>4.1 Triple función<\/h3>\n<ol>\n<li><strong>Prueba<\/strong> la existencia del contrato<\/li>\n<li>Es un <strong>título valor<\/strong> → transmite la <strong>titularidad<\/strong> de la mercancía<\/li>\n<li>Acredita la <strong>recepción<\/strong> de la mercancía y su <strong>estado<\/strong><\/li>\n<\/ol>\n<h3>4.2 Clases<\/h3>\n<ul>\n<li><strong>Nominativo<\/strong> → se entrega a una <strong>persona concreta<\/strong><\/li>\n<li><strong>A la orden<\/strong> → se entrega <strong>a la orden del cargador<\/strong> (se transmite por endoso)<\/li>\n<li><strong>Al portador<\/strong> → se entrega a <strong>quien lo presente<\/strong><\/li>\n<\/ul>\n<h2>5. Responsabilidad del porteador<\/h2>\n<ul>\n<li>Responde <strong>civilmente<\/strong> de pérdidas y daños: es una <strong>obligación de resultado<\/strong> (entregar la mercancía <strong>tal como la recibió<\/strong>)<\/li>\n<li><strong>No responde<\/strong> en caso de:<ul>\n<li><strong>Incendio<\/strong>, salvo que lo cause él<\/li>\n<li><strong>Peligros del mar<\/strong> y <strong>fuerza mayor<\/strong><\/li>\n<li><strong>Guerra<\/strong> o enemigos públicos<\/li>\n<li><strong>Embargo<\/strong> de autoridades, <strong>cuarentena<\/strong>, <strong>huelgas<\/strong><\/li>\n<li><strong>Salvamento de vidas<\/strong> en el mar<\/li>\n<li>Mermas por <strong>vicios ocultos<\/strong> de la mercancía<\/li>\n<li><strong>Embala
