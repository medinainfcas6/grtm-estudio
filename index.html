<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Bitácora GRTM: apuntes, mapas mentales, banco de preguntas resuelto y examen de respuesta corta de Gestión y Regulación del Transporte Marítimo (4º GTL, UPV).">
<meta name="theme-color" content="#0f2233">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f2233'/%3E%3Cpath d='M16 6v18M10 11h12M7 18c1 5 5 8 9 8s8-3 9-8' fill='none' stroke='%23ff7a4a' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Bitácora GRTM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: carta náutica. Barra lateral con los temas; contenido en una columna de lectura. */
:root{
  --paper:#edf1f2; --surface:#fbfcfc; --surface-2:#e3e9eb; --ink:#0f2233; --muted:#55687a; --line:#c6d1d6;
  --sea:#1c5a85; --sea-soft:#d5e4ee; --accent:#d9481f; --accent-ink:#ffffff; --accent-soft:#f8dfd5;
  --good:#23845a; --good-soft:#d6efe2; --mid:#b07d0c; --mid-soft:#f6ebcf; --bad:#c13a2a; --bad-soft:#f6d9d4;
  --b1:#1c5a85; --b2:#b8461f; --b3:#2b7a63; --b4:#7a4fa0; --b5:#a2741a; --b6:#3b6f9e; --b7:#9b3b5a;
  --contour:rgba(28,90,133,.13); --deep:#0f2233; --deep-2:#1a3550; --deep-fg:#edf1f2;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(15,34,51,.06),0 8px 24px -12px rgba(15,34,51,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0a1520; --surface:#0f1f2d; --surface-2:#152a3b; --ink:#e2e9ee; --muted:#93a6b6; --line:#22394c;
  --sea:#72b3e0; --sea-soft:#163349; --accent:#ff7a4a; --accent-ink:#1a0c05; --accent-soft:#3a2016;
  --good:#5cc995; --good-soft:#12392a; --mid:#e2b44a; --mid-soft:#3a2f12; --bad:#ff7d6b; --bad-soft:#3d1c18;
  --b1:#72b3e0; --b2:#ff8a5c; --b3:#5cc4a3; --b4:#b897e0; --b5:#e4b452; --b6:#8fb8e6; --b7:#e889a8;
  --contour:rgba(114,179,224,.10); --deep:#173350; --deep-2:#21446a; --deep-fg:#eef4f8; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0a1520; --surface:#0f1f2d; --surface-2:#152a3b; --ink:#e2e9ee; --muted:#93a6b6; --line:#22394c;
  --sea:#72b3e0; --sea-soft:#163349; --accent:#ff7a4a; --accent-ink:#1a0c05; --accent-soft:#3a2016;
  --good:#5cc995; --good-soft:#12392a; --mid:#e2b44a; --mid-soft:#3a2f12; --bad:#ff7d6b; --bad-soft:#3d1c18;
  --b1:#72b3e0; --b2:#ff8a5c; --b3:#5cc4a3; --b4:#b897e0; --b5:#e4b452; --b6:#8fb8e6; --b7:#e889a8;
  --contour:rgba(114,179,224,.10); --deep:#173350; --deep-2:#21446a; --deep-fg:#eef4f8; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:400 15.5px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{text-wrap:balance;line-height:1.15;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono)}
.eyebrow{font:500 11.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
a{color:var(--sea)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Botones ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--surface-2);color:var(--ink);transition:transform .12s ease,background .15s}
.btn:hover{background:color-mix(in srgb,var(--surface-2) 80%,var(--ink) 8%)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-sm{padding:6px 11px;font-size:13.5px;border-radius:7px}
.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.err{color:var(--bad);font-size:14px;min-height:1.3em;margin:0}

/* ---------- App ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px 16px max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;text-decoration:none;color:inherit}
.brand b{font:800 26px/0.9 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.brand small{display:block;font:400 11px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.06em}
.navgroup{display:grid;gap:2px;margin-bottom:16px}
.navgroup .eyebrow{padding:6px 10px}
.nav{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:14.5px;line-height:1.25}
.nav:hover{background:var(--surface-2)}
.nav[aria-current="true"]{background:var(--sea-soft);color:var(--ink)}
.nav .n{font:700 17px/1 var(--f-display);width:30px;color:var(--muted)}
.nav[aria-current="true"] .n{color:var(--sea)}
.nav .ico{flex:none;width:27px;text-align:center;color:var(--muted)}
.side-foot{margin-top:auto;display:grid;gap:8px;padding:12px 8px 0;border-top:1px solid var(--line)}
.side-foot .row{display:flex;gap:6px;flex-wrap:wrap}
.topbar{display:none}
main{min-width:0;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:22px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:30;transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(5,12,20,.45);z-index:25}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
  .topbar b{font:800 22px/1 var(--f-display);text-transform:uppercase}
  .topbar .where{margin-left:auto;font:500 12px/1 var(--f-mono);color:var(--muted);text-align:right}
  main{padding-top:20px}
}

/* ---------- Inicio ---------- */
.hero{position:relative;overflow:hidden;border-radius:16px;background:var(--deep);color:var(--deep-fg);padding:34px 30px 30px;display:grid;gap:14px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.hero > *:not(canvas){position:relative}
.hero h1{font:800 clamp(44px,7vw,78px)/0.9 var(--f-display);text-transform:uppercase;letter-spacing:.005em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;max-width:60ch;opacity:.85}
.hero .eyebrow{color:inherit;opacity:.7}
.hero-stats{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:6px;font:400 13px/1.3 var(--f-mono)}
.hero-stats b{display:block;font:700 30px/1 var(--f-display);color:var(--accent)}
.grid-temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 14px;display:grid;gap:12px;align-content:start}
.tcard-head{display:flex;gap:12px;align-items:flex-start}
.tcard-head .num{font:800 40px/0.8 var(--f-display);color:var(--sea);min-width:52px}
.tcard h3{font:600 17px/1.25 var(--f-body)}
.tcard .meta{font:400 12px/1.3 var(--f-mono);color:var(--muted)}
.tcard-links{display:flex;flex-wrap:wrap;gap:6px}
.chip-link{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--paper)}
.chip-link:hover{border-color:var(--sea);color:var(--sea)}
.search{display:grid;gap:8px}
.search input{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--sea);outline:none}
.hits{display:grid;gap:8px;margin-top:4px}
.hit{display:grid;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
.hit:hover{border-color:var(--sea)}
.hit .pill{justify-self:start}
.hit b{font-weight:600;line-height:1.35}
.hit small{color:var(--muted);font-size:13px;line-height:1.45}
.tprog.left{justify-items:start;min-width:0}
.exam-cta{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r);padding:18px 20px}
.exam-cta h3{font:700 26px/1 var(--f-display);text-transform:uppercase}
.exam-cta p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.note{border-left:3px solid var(--sea);background:var(--surface);padding:12px 16px;border-radius:0 8px 8px 0;color:var(--muted);font-size:14.5px}
.note b{color:var(--ink)}
.note.warn{border-color:var(--mid);background:var(--mid-soft);color:var(--ink)}

/* ---------- Tema ---------- */
.thead{display:grid;gap:10px}
.thead-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.thead .big{font:800 clamp(56px,8vw,92px)/0.8 var(--f-display);color:var(--sea);letter-spacing:-.01em}
.thead h1{font:700 clamp(26px,3.6vw,38px)/1.05 var(--f-display);text-transform:uppercase;max-width:22ch}
.thead .src{font:400 12.5px/1.4 var(--f-mono);color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{white-space:nowrap;padding:10px 14px;border:0;background:none;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font:500 11px/1 var(--f-mono);background:var(--surface-2);padding:3px 6px;border-radius:99px}

.study{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:1100px){.study{grid-template-columns:minmax(0,1fr)}}
.prose{min-width:0;max-width:72ch}
.prose h2{font:700 28px/1.05 var(--f-display);text-transform:uppercase;margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--line);letter-spacing:.01em}
.prose h2,.prose h3{scroll-margin-top:16px}
@media (max-width:900px){.prose h2,.prose h3{scroll-margin-top:72px}}
.prose h2:first-child{margin-top:0;border-top:0;padding-top:0}
.prose h3{font:600 17.5px/1.3 var(--f-body);margin:22px 0 8px;color:var(--sea)}
.prose h4{font:600 15px/1.3 var(--f-body);margin:16px 0 6px}
.prose p{margin:8px 0}
.prose ul,.prose ol{margin:6px 0 10px;padding-left:1.25em}
.prose li{margin:3px 0}
.prose li::marker{color:var(--muted)}
.prose ul ul{margin:3px 0}
.prose strong,.prose b{font-weight:600}
.tablebox{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.prose table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:440px}
.prose th,.prose td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.prose th{background:var(--surface-2);font-weight:600;font-size:13.5px}
.prose tr:last-child td{border-bottom:0}
.prose td p,.prose th p{margin:0}
.aside{position:sticky;top:20px;display:grid;gap:14px}
.keybox{background:var(--deep);color:var(--deep-fg);border-radius:var(--r);padding:16px 18px}
.keybox h3{font:700 22px/1 var(--f-display);text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.keybox ul{margin:0;padding-left:1.1em;font-size:14px;display:grid;gap:6px}
.keybox strong{color:#fff;font-weight:600}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:13.5px}
.toc a{display:block;padding:3px 0;text-decoration:none;color:var(--muted)}
.toc a:hover{color:var(--sea)}
.toc a.sub{padding-left:12px;font-size:12.5px}
.aside{max-height:calc(100vh - 40px);overflow:auto;scrollbar-width:thin}
@media (max-width:1100px){.aside{max-height:none;overflow:visible}}
.prose blockquote{margin:12px 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.prose blockquote p{margin:0}
.pager{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:34px}
.pager a{display:grid;gap:3px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
.pager a:hover{border-color:var(--sea)}
.pager small{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pager b{font-weight:600;font-size:14.5px;line-height:1.3}
.pager .mid{background:var(--sea-soft);border-color:transparent}.pager .nx{text-align:right}
@media (max-width:620px){.pager{grid-template-columns:minmax(0,1fr)}.pager .nx{text-align:left}.pager span{display:none}}
.extra{margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px}
.extra h2{border:0!important;padding:0!important;margin:0 0 4px!important}
.extra .eyebrow{margin-bottom:6px}
@media (max-width:1100px){.aside{position:static}}

/* ---------- Mapa mental ---------- */
.mm{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 210px minmax(0,1fr);gap:20px 64px;align-items:center;padding:12px 0}
.mm svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mm-col{display:grid;gap:16px;min-width:0}
.mm-root{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--deep);color:var(--deep-fg);display:grid;place-items:center;text-align:center;padding:22px;position:relative;box-shadow:0 0 0 8px var(--paper),0 0 0 9px var(--line)}
.mm-root b{font:800 25px/0.95 var(--f-display);text-transform:uppercase}
.mm-root small{display:block;font:500 11px/1 var(--f-mono);letter-spacing:.12em;opacity:.7;margin-bottom:6px}
.mm-node{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:9px;padding:11px 13px 12px;position:relative}
.mm-node h4{font:700 17px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;color:var(--c);margin-bottom:8px}
.mm-leaves{display:flex;flex-wrap:wrap;gap:5px}
.mm-leaf{font-size:13px;line-height:1.3;padding:4px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 22%,transparent)}
@media (max-width:820px){
  .mm{grid-template-columns:minmax(0,1fr);gap:14px}
  .mm svg.links{display:none}
  .mm-root{aspect-ratio:auto;border-radius:12px;box-shadow:none;padding:16px}
  .mm-col{padding-left:18px;border-left:2px dashed var(--line);margin-left:12px}
  .mm-col .mm-node::before{content:"";position:absolute;left:-20px;top:20px;width:18px;border-top:2px dashed var(--line)}
}

/* ---------- Preguntas ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.qlist{display:grid;gap:12px}
.seg-sm button{padding:5px 10px;font-size:13px}
.tprog{display:grid;gap:5px;min-width:min(260px,100%);justify-items:end}
.pbar{display:flex;width:100%;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%}.pbar .ok{background:var(--good)}.pbar .rep{background:var(--mid)}
.marks{display:inline-flex;gap:4px;margin-left:auto}
.mk{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.mk:hover{color:var(--ink)}
.mk.ok[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.mk.rep[aria-pressed="true"]{background:var(--mid-soft);border-color:var(--mid);color:var(--mid)}
.q[data-mark="ok"]{border-left:4px solid var(--good)}.q[data-mark="rep"]{border-left:4px solid var(--mid)}
.empty{color:var(--muted);text-align:center;padding:24px;border:1px dashed var(--line);border-radius:var(--r);margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.q-top{display:flex;gap:12px;align-items:flex-start}
.qnum{flex:none;font:500 11.5px/1 var(--f-mono);padding:5px 7px;border-radius:5px;background:var(--sea-soft);color:var(--sea);white-space:nowrap;margin-top:2px}
.qnum.own{background:var(--accent-soft);color:var(--accent)}
.q-text{font-weight:600;font-size:16px;line-height:1.4}
.q-actions{display:flex;gap:8px;flex-wrap:wrap}
.answer{border-top:1px dashed var(--line);padding-top:10px}
.answer .eyebrow{margin-bottom:4px}
textarea{width:100%;min-height:130px;resize:vertical;padding:12px 14px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);line-height:1.55}
textarea:focus{border-color:var(--sea);outline:none}
.wc{font:400 12px/1 var(--f-mono);color:var(--muted)}

/* ---------- Nota ---------- */
.grade{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start;border-radius:10px;padding:14px 16px;background:var(--tone-soft);border:1px solid color-mix(in srgb,var(--tone) 30%,transparent)}
.grade.good{--tone:var(--good);--tone-soft:var(--good-soft)} .grade.mid{--tone:var(--mid);--tone-soft:var(--mid-soft)} .grade.bad{--tone:var(--bad);--tone-soft:var(--bad-soft)}
.ring{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--tone) calc(var(--p)*1%),color-mix(in srgb,var(--tone) 15%,var(--surface)) 0);position:relative}
.ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;z-index:1;font:800 24px/1 var(--f-display);color:var(--tone)}
.grade h4{font:600 15.5px/1.35 var(--f-body);margin-bottom:4px}
.grade p{margin:4px 0}
.grade ul{margin:4px 0 6px;padding-left:1.15em;font-size:14.5px}
.glabel{font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tone);margin-top:8px}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--sea);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ---------- Examen ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.form{display:grid;gap:22px}
.field{display:grid;gap:9px}
.field > .lab{font:600 15px/1.2 var(--f-body)}
.field > .hint{font-size:13.5px;color:var(--muted);margin-top:-4px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:inline-flex;gap:8px;align-items:center;padding:9px 13px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);font-weight:500;font-size:14.5px;cursor:pointer}
.opt input:checked + span{border-color:var(--sea);background:var(--sea-soft)}
.opt input:focus-visible + span{outline:2.5px solid var(--accent);outline-offset:2px}
.opt small{font:400 11.5px/1 var(--f-mono);color:var(--muted)}
.aistat{margin:0;font-size:14px;color:var(--muted);padding:10px 14px;border-radius:9px;background:var(--paper);border:1px solid var(--line)}
.aistat.on{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 35%,transparent);color:var(--ink)}
.aistat b{color:var(--ink)}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;min-width:0;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);font:400 14px var(--f-mono)}
.keyrow input:focus{border-color:var(--sea);outline:none}
.range-row{display:flex;align-items:center;gap:14px}
.range-row input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.range-row output{font:800 34px/1 var(--f-display);min-width:58px;text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}
.exam-bar{position:sticky;top:10px;z-index:5;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--deep);color:var(--deep-fg);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow)}
@media (max-width:900px){.exam-bar{top:calc(62px + env(safe-area-inset-top,0px))}}
.exam-bar .clock{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.exam-bar .prog{font:400 12.5px/1.3 var(--f-mono);opacity:.8}
.exam-bar .btn-primary{white-space:nowrap}
.summary{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.summary .big-ring{width:128px;height:128px}
.summary .big-ring::after{inset:10px}
.summary .big-ring span{font-size:44px}
.summary h2{font:800 34px/1 var(--f-display);text-transform:uppercase}
.statline{display:flex;flex-wrap:wrap;gap:8px 22px;font:400 13px/1.4 var(--f-mono);color:var(--muted);margin-top:8px}
.statline b{color:var(--ink);font-weight:500}
.hist{display:grid;gap:6px}
.hist-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--paper);font-size:14px}
.hist-row .n{font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font:500 11px/1 var(--f-mono);padding:4px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
@media (max-width:520px){
  .q-top{flex-direction:column;gap:8px}
  .tab{padding:10px 9px;font-size:14.5px}
  .summary{grid-template-columns:minmax(0,1fr)} .grade{grid-template-columns:minmax(0,1fr)}
  .hero{padding:26px 20px} .panel{padding:18px}
}

<script>
const DATA = {"temas": [{"id": "t1", "num": "1", "title": "Mercancías y pasajeros", "short": "Mercancías", "fuente": "Apuntes JH del Tema 1 + diapositivas del profesor", "estudio": "<h2>1. Mercancías<\/h2>\n<h3>1.1 Criterios de clasificación<\/h3>\n<ul>\n<li><strong>Por sector productivo<\/strong><\/li>\n<li><strong>Por forma de presentación<\/strong><ul>\n<li><strong>Graneles<\/strong>: sin envase, el único \"envase\" es el <strong>propio buque<\/strong><ul>\n<li><strong>Sólidos<\/strong> → ligeros y minerales<\/li>\n<li><strong>Líquidos<\/strong><\/li>\n<\/ul>\n<\/li>\n<li><strong>Mercancía general<\/strong>: viaja envasada o clasificada, así que hay que <strong>contar las unidades<\/strong> (envasada, ensacada, cargas unitarias…)<\/li>\n<li><strong>Transporte intermodal<\/strong>: en recipientes <strong>reutilizables<\/strong> que pasan de un modo a otro <strong>sin cambios<\/strong> (contenedores)<\/li>\n<\/ul>\n<\/li>\n<li><strong>Por características de la carga<\/strong><ul>\n<li><strong>Sucia / limpia<\/strong> → si desprende restos o no<\/li>\n<li><strong>Seca / húmeda<\/strong> → si rezuma a través del envase<\/li>\n<li><strong>Frágil / delicada<\/strong> → según las aceleraciones que soporta<\/li>\n<li><strong>Refrigerada / congelada / ordinaria<\/strong><\/li>\n<li><strong>Perecedera / no perecedera<\/strong><\/li>\n<\/ul>\n<\/li>\n<li><strong>Por peligrosidad<\/strong><\/li>\n<\/ul>\n<h3>1.2 El contenedor<\/h3>\n<ul>\n<li>Estándar reconocido por la <strong>ISO 668<\/strong><\/li>\n<li><strong>Medidas<\/strong><ul>\n<li>Largo: <strong>20', 40' y 45'<\/strong><\/li>\n<li>Ancho: <strong>8'<\/strong><\/li>\n<li>Alto: <strong>8'6''<\/strong><\/li>\n<\/ul>\n<\/li>\n<li><strong>Huella<\/strong> (ancho × largo) → lo importante para la manipulación, porque facilita el <strong>apilado<\/strong><\/li>\n<li>La ISO exige que resista <strong>6 contenedores encima<\/strong> como máximo<\/li>\n<li><strong>Materiales<\/strong><ul>\n<li><strong>Acero<\/strong> → estructura, también cerramientos e interiores<\/li>\n<li><strong>Aluminio<\/strong> → para <strong>aligerar<\/strong><\/li>\n<li><strong>Madera<\/strong> → interiores, a veces reforzada con <strong>fibra de vidrio<\/strong><\/li>\n<\/ul>\n<\/li>\n<li><strong>Identificación<\/strong>: <strong>matrícula<\/strong><\/li>\n<li><strong>Precintos<\/strong> (mecánicos y electrónicos) → acreditan que <strong>no ha sido abierto<\/strong><\/li>\n<\/ul>\n<h3>1.3 Palé<\/h3>\n<ul>\n<li>Armazón para transportar carga y manejarla con <strong>maquinaria ligera<\/strong><\/li>\n<li>Tipos: doble suelo, reversible, medio palé, de dos o cuatro entradas…<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Ventajas frente al <strong>contenedor<\/strong><\/th>\n<th>Ventajas frente a <strong>envases ordinarios<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Muy <strong>económico<\/strong><\/td>\n<td>Apenas <strong>encarece<\/strong> el producto<\/td>\n<\/tr>\n<tr>\n<td>Lo puede preparar el <strong>propio fabricante<\/strong><\/td>\n<td>Facilita el manejo con <strong>carretillas<\/strong><\/td>\n<\/tr>\n<tr>\n<td>No necesita medios de transporte costosos<\/td>\n<td>Más <strong>seguridad frente a golpes<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Inconvenientes<\/strong><ul>\n<li><strong>No es un estándar mundial<\/strong><\/li>\n<li>Los de <strong>madera<\/strong> pueden propagar <strong>plagas<\/strong>, así que necesitan <strong>tratamiento<\/strong><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>1.4 Cassettes<\/h3>\n<ul>\n<li><strong>Gran palé o contenedor metálico<\/strong> para cargas que por <strong>tamaño o peso<\/strong> no caben en otro sitio<\/li>\n<li>Algunos pueden <strong>rodar<\/strong>, pero <strong>no tienen permiso de circulación<\/strong><\/li>\n<li>Muy <strong>reutilizables<\/strong><\/li>\n<\/ul>\n<h3>1.5 Mercancías perecederas<\/h3>\n<ul>\n<li><strong>Vida útil muy limitada<\/strong>, necesitan condiciones especiales de <strong>temperatura, humedad y tiempo<\/strong><\/li>\n<li><strong>Tipos<\/strong>: alimentos frescos, lácteos, farmacéuticos, productos naturales<\/li>\n<li><strong>A tener en cuenta<\/strong><ul>\n<li><strong>Cadena de frío<\/strong><\/li>\n<li>Diferencia entre <strong>refrigeración y congelación<\/strong><\/li>\n<li><strong>Embalaje especial<\/strong><\/li>\n<\/ul>\n<\/li>\n<li>Poco usadas en el transporte marítimo hasta la aparición del <strong>contenedor reefer<\/strong><\/li>\n<\/ul>\n<h3>1.6 Mercancías peligrosas<\/h3>\n<h4>Normativa según el modo<\/h4>\n<table>\n<thead>\n<tr>\n<th>Modo<\/th>\n<th>Norma<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Marítimo<\/td>\n<td><strong>IMDG<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Carretera<\/td>\n<td><strong>ADR<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Ferrocarril<\/td>\n<td><strong>RID<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Las 9 clases<\/h4>\n<table>\n<thead>\n<tr>\n<th>Clase<\/th>\n<th>Tipo<\/th>\n<th>Notas<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td><strong>Explosivos<\/strong><\/td>\n<td>Dinamita, fuegos artificiales<\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td><strong>Gases<\/strong><\/td>\n<td>3 subdivisiones (oxígeno, cloro, propano…)<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td><strong>Líquidos inflamables<\/strong><\/td>\n<td>Arden ellos o sus gases. 3 subdivisiones<\/td>\n<\/tr>\n<tr>\n<td><strong>4<\/strong><\/td>\n<td><strong>Sólidos inflamables<\/strong><\/td>\n<td>Igual que los líquidos<\/td>\n<\/tr>\n<tr>\n<td><strong>5<\/strong><\/td>\n<td><strong>Oxidantes y peróxidos orgánicos<\/strong><\/td>\n<td>Liberan oxígeno fácilmente o se descomponen exotérmicamente<\/td>\n<\/tr>\n<tr>\n<td><strong>6<\/strong><\/td>\n<td><strong>Tóxicas e infecciosas<\/strong><\/td>\n<td>2 subdivisiones<\/td>\n<\/tr>\n<tr>\n<td><strong>7<\/strong><\/td>\n<td><strong>Radiactivas<\/strong><\/td>\n<td>2 subdivisiones<\/td>\n<\/tr>\n<tr>\n<td><strong>8<\/strong><\/td>\n<td><strong>Corrosivas<\/strong><\/td>\n<td>3 subdivisiones<\/td>\n<\/tr>\n<tr>\n<td><strong>9<\/strong><\/td>\n<td><strong>Diversas<\/strong><\/td>\n<td>Lo que no encaja en las anteriores<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Segregación por incompatibilidad<\/strong>: hay que mantener <strong>distancias<\/strong> entre unidades de carga, fijadas en el <strong>IMDG<\/strong><ul>\n<li><strong>Cuanto mayor es el número<\/strong> de segregación, <strong>más lejos<\/strong> deben ir<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. Pasajeros<\/h2>\n<ul>\n<li><strong>Pasajero ordinario<\/strong> → se desplaza de un puerto a otro<\/li>\n<li><strong>Crucerista<\/strong> → viaja por <strong>ocio<\/strong><\/li>\n<li>Hay que tener en cuenta los <strong>controles fronterizos<\/strong> al embarcar y desembarcar<ul>\n<li><strong>Mercancías<\/strong>: dentro de la <strong>UE (27)<\/strong> circulan <strong>libremente<\/strong>, sin control<\/li>\n<li><strong>Personas<\/strong>: dentro del <strong>Espacio Schengen<\/strong> circulan <strong>sin control<\/strong><\/li>\n<\/ul>\n<\/li>\n<\/ul>", "ideas": "<ul>\n<li>Formas de presentación: <strong>granel · mercancía general · intermodal<\/strong><\/li>\n<li>Contenedor <strong>ISO 668<\/strong>: 20'/40'/45' × 8' × 8'6'', apilable hasta <strong>6<\/strong><\/li>\n<li>Palé: <strong>barato y práctico<\/strong>, pero <strong>no es estándar mundial<\/strong> y la madera exige <strong>tratamiento<\/strong><\/li>\n<li>Peligrosas: <strong>IMDG (mar) · ADR (carretera) · RID (tren)<\/strong> y <strong>9 clases<\/strong><\/li>\n<li><strong>UE<\/strong> = libre circulación de mercancías · <strong>Schengen<\/strong> = libre circulación de personas<\/li>\n<\/ul>", "amplia": "\n<ul>\n<li><b>Para qué se clasifica<\/b>: aranceles (Aduanas, la <b>TARIC<\/b> de la UE), estadísticas (<b>NST 2007<\/b>), tasas portuarias (<b>Anexo III<\/b> de la Ley de Puertos), previsión de tráficos por sector productivo.<\/li>\n<li><b>La forma de presentación manda<\/b>: en el puerto se manipulan formas de presentación, no mercancías. Ejemplo del profesor, el <b>cemento<\/b>: a granel va en cementero, en sacos o sacos sobre palés en buque de carga general y en palés dentro de un contenedor en portacontenedores.<\/li>\n<li><b>Ojo con el \"vino a granel\"<\/b>: si viaja en barril es mercancía general, porque el barril es un envase.<\/li>\n<li><b>Mercancía general<\/b>: convencional o fraccionada (break-bulk: envasada, ensacada, cargas unitarias), unitizada (agrupada) y <b>cargas de proyecto<\/b> (aspas de aerogenerador, hornos).<\/li>\n<li><b>ISO 668 (1968)<\/b>: largos iniciales de 10', 20', 30' y 40'; hoy 20', 40' y 45'. Carga máxima uniforme de <b>30,48 t<\/b>. Los <b>high cube<\/b> miden <b>9'6\"<\/b> de alto.<\/li>\n<li><b>TEU y FEU<\/b>: el 95 % de los contenedores son de 20' o 40'. 1 contenedor de 20' = 1 TEU; uno de 40' = 2 TEU (1 FEU).<\/li>\n<li><b>Estructura<\/b>: 8 vigas horizontales y 4 pilares; acceso por puertas en un testero. Acero <b>corten<\/b> por su resistencia a la corrosión.<\/li>\n<li><b>Precintos<\/b>: mecánicos (baratos, desechables, <b>ISO 17712<\/b>) y electrónicos (reutilizables, con RFID, <b>ISO 18185<\/b>).<\/li>\n<li><b>Europalet<\/b>: 800 × 1200 mm. La ISO reconoce seis medidas de palé, ninguna es estándar mundial.<\/li>\n<li><b>Cassettes<\/b>: plataformas de 50 hasta 90–120 t para bobinas de papel o acero y productos forestales; sin normalizar (p. ej. el SECU).<\/li>\n<li><b>Perecederos<\/b>: el límite entre refrigerar y congelar son los <b>0 ºC<\/b>. El <b>reefer<\/b> dejó obsoletos a los buques frigoríficos y permitió envíos pequeños a larga distancia. Los <b>smart containers<\/b> se aplicaron primero en reefers.<\/li>\n<li><b>Peligrosas<\/b>: el <b>IMSBC<\/b> regula graneles sólidos (salvo granos) y el <b>IMDG<\/b>, la mercancía general. El IMDG nace del convenio <b>SOLAS<\/b>.<\/li>\n<\/ul>", "mapa": {"root": "Mercancías y pasajeros", "ramas": [{"t": "Clasificación", "h": ["Sector productivo", "Forma de presentación: granel · general · intermodal", "Características: sucia, húmeda, frágil, refrigerada, perecedera", "Peligrosidad"]}, {"t": "Contenedor", "h": ["ISO 668: 20' · 40' · 45' × 8' × 8'6\"", "Huella → apilado (6 alturas)", "Acero · aluminio · madera", "Matrícula y precintos", "TEU = 20'"]}, {"t": "Palé y cassette", "h": ["Palé: barato, lo prepara el fabricante", "No es estándar mundial", "Madera → plagas → tratamiento", "Cassette: cargas enormes, reutilizable"]}, {"t": "Perecederas", "h": ["Vida útil corta", "Cadena de frío", "Refrigerar > 0 ºC > congelar", "El reefer lo cambió todo"]}, {"t": "Peligrosas", "h": ["IMDG mar · ADR carretera · RID tren", "9 clases", "Segregación: más número, más distancia"]}, {"t": "Pasajeros", "h": ["Ordinario vs crucerista", "UE: mercancías libres", "Schengen: personas libres"]}]}, "banco": [{"id": "B1-1", "src": "Tema 1 · 1", "q": "Explica los criterios de clasificación de las mercancías en el transporte marítimo y su utilidad práctica.", "a": "\n<p>Las mercancías se clasifican según el uso que se vaya a dar a esa clasificación:<\/p>\n<ul><li><p><b>Aranceles<\/b>: la Aduana clasifica para cobrar derechos (en España, la TARIC de la UE).<\/p><\/li><li><p><b>Estadística<\/b>: para medir tráficos (p. ej. la nomenclatura europea NST 2007).<\/p><\/li><li><p><b>Tasas portuarias<\/b>: el Anexo III de la Ley de Puertos agrupa mercancías para fijar la tasa.<\/p><\/li><li><p><b>Sector productivo<\/b>: energético, siderúrgico, agroalimentario, químico, construcción… Sirve para prever tráficos portuarios ligándolos a las previsiones de cada sector.<\/p><\/li><li><p><b>Forma de presentación<\/b>: graneles, mercancía general y unidades intermodales. Es la más importante porque determina el buque, la terminal y el coste.<\/p><\/li><li><p><b>Características de la carga<\/b>: sucia/limpia, seca/húmeda, frágil, refrigerada/congelada, perecedera.<\/p><\/li><li><p><b>Peligrosidad<\/b>: según el Código IMDG (9 clases).<\/p><\/li><\/ul>\n<p>Utilidad práctica: elegir buque y terminal, calcular costes y tasas, planificar la estiba y la segregación, y prever la demanda portuaria.<\/p>\n"}, {"id": "B1-2", "src": "Tema 1 · 2", "q": "Diferencia entre clasificación por sector productivo y por forma de presentación, con ejemplos.", "a": "\n<ul><li><p><b>Sector productivo<\/b>: agrupa por la naturaleza económica del bien. Ejemplos: energético (crudo, GLP, carbón térmico), siderúrgico (mineral de hierro, chatarra), agroalimentario (cereales, soja, vino), construcción (cemento, áridos). Sirve para estadísticas y previsiones.<\/p><\/li><li><p><b>Forma de presentación<\/b>: agrupa por cómo viaja y se manipula, no por lo que es. Ejemplo del profesor, el cemento:<\/p><ul><li><p>a granel → buque cementero (granel sólido);<\/p><\/li><li><p>en sacos o en sacos sobre palés → buque de mercancía general convencional;<\/p><\/li><li><p>en palés dentro de un contenedor → portacontenedores.<\/p><\/li><\/ul><\/li><\/ul>\n<p>Idea clave: en el puerto se manipulan formas de presentación, no mercancías. Una misma mercancía puede dar tráficos, costes y terminales distintos.<\/p>\n"}, {"id": "B1-3", "src": "Tema 1 · 3", "q": "Analiza la importancia de la forma de presentación de las mercancías en la elección del tipo de buque.", "a": "\n<p>La forma de presentación decide el buque, la terminal y el sistema de manipulación, y por tanto los costes:<\/p>\n<table><tr><th><p>Forma de presentación<\/p><\/th><th><p>Buque<\/p><\/th><th><p>Manipulación<\/p><\/th><\/tr><tr><td><p>Granel sólido<\/p><\/td><td><p>Granelero (bulk carrier)<\/p><\/td><td><p>Cucharas, cintas, succionadoras<\/p><\/td><\/tr><tr><td><p>Granel líquido<\/p><\/td><td><p>Buque cisterna (petrolero, quimiquero, gasero)<\/p><\/td><td><p>Tuberías y bombas<\/p><\/td><\/tr><tr><td><p>Mercancía general convencional<\/p><\/td><td><p>Carga general / multipropósito<\/p><\/td><td><p>Grúas, unidad a unidad (lo/lo)<\/p><\/td><\/tr><tr><td><p>Contenedores<\/p><\/td><td><p>Portacontenedores<\/p><\/td><td><p>Grúas portainer (lo/lo)<\/p><\/td><\/tr><tr><td><p>Carga rodada<\/p><\/td><td><p>Ro/Ro, ferry<\/p><\/td><td><p>Rampas (ro/ro)<\/p><\/td><\/tr><\/table>\n<p>Además condiciona la medición de la actividad: los graneles se pesan o cubican, la mercancía general se cuenta por unidades y los contenedores se cuentan en TEU.<\/p>\n"}, {"id": "B1-4", "src": "Tema 1 · 4", "q": "Compara los tipos de graneles (sólidos y líquidos) e indica ejemplos.", "a": "\n<p>Granel es mercancía sin más envase que el propio buque; su actividad se mide pesando o cubicando.<\/p>\n<ul><li><p><b>Graneles sólidos<\/b>, según su densidad aparente respecto al agua:<\/p><ul><li><p>Ligeros: cereales, carbón.<\/p><\/li><li><p>Minerales (densos): hierro, bauxita, caolín, arcillas.<\/p><\/li><li><p>Viajan en graneleros de cubierta única; en los de minerales densos parte del buque queda vacía o para lastre, porque si se llenara se hundiría.<\/p><\/li><\/ul><\/li><li><p><b>Graneles líquidos<\/b>:<\/p><ul><li><p>Petróleo crudo y refinados (petroleros).<\/p><\/li><li><p>Gases combustibles: GNL a –162 ºC y presión atmosférica; GLP a presión y hasta –50 ºC (gaseros).<\/p><\/li><li><p>Resto: productos químicos (quimiqueros), agua, aceites, vino.<\/p><\/li><li><p>Viajan en buques cisterna, obligatoriamente de doble casco.<\/p><\/li><\/ul><\/li><\/ul>\n<p>Ojo: \"vino a granel\" en barril no es granel, el barril es un envase y por tanto es mercancía general.<\/p>\n"}, {"id": "B1-5", "src": "Tema 1 · 5", "q": "Expón las principales características de la mercancía general convencional y las diferencias con la unitarizada.", "a": "\n<p>La mercancía general viaja envasada o clasificada y se mide contando unidades.<\/p>\n<ul><li><p><b>Convencional (fraccionada o break‑bulk)<\/b>: bultos sueltos que se manipulan uno a uno: envasada (envase rígido: cajas, barriles), ensacada (sacos, balas de algodón) y cargas unitarias (piezas sueltas grandes, como un torno). Incluye las cargas de proyecto (aspas de aerogenerador), donde el transporte es decisivo en el diseño.<\/p><\/li><li><p><b>Unitarizada (unitizada)<\/b>: los bultos anteriores se agrupan para manejarlos de una vez (palés, eslingas, y en su máxima expresión el contenedor).<\/p><\/li><\/ul>\n<p>Diferencias: la unitarizada reduce el número de movimientos, el tiempo en puerto, las roturas y los robos, y permite mecanizar con carretillas o grúas. La convencional exige más mano de obra y más tiempo, y viaja en buques de carga general.<\/p>\n"}, {"id": "B1-6", "src": "Tema 1 · 6", "q": "Describe los diferentes tipos de mercancía peligrosa y cómo se regulan internacionalmente.", "a": "\n<p><b>Clases IMDG<\/b>:<\/p>\n<ol><li><p>Explosivos (dinamita, fuegos artificiales).<\/p><\/li><li><p>Gases: 2.1 inflamables, 2.2 no inflamables, 2.3 tóxicos (propano, oxígeno, cloro).<\/p><\/li><li><p>Líquidos inflamables (gasolina, acetona).<\/p><\/li><li><p>Sólidos inflamables: 4.1, 4.2 inflamación espontánea, 4.3 que desprenden gases con el agua (cerillas, magnesio).<\/p><\/li><li><p>Oxidantes (5.1) y peróxidos orgánicos (5.2).<\/p><\/li><li><p>Tóxicas (6.1) e infecciosas (6.2) (cianuro, virus).<\/p><\/li><li><p>Radiactivas (uranio).<\/p><\/li><li><p>Corrosivas (ácido sulfúrico, sosa).<\/p><\/li><li><p>Diversas: las que no encajan en las anteriores.<\/p><\/li><\/ol>\n<p><b>Regulación<\/b>:<\/p>\n<ul><li><p><b>Código IMDG<\/b> (OMI, derivado de SOLAS cap. VII): mercancía general peligrosa por mar. Fija clasificación, embalaje, etiquetado (etiquetas de peligro, marcas, paneles con nº ONU), documentación (declaración de MP, certificado de embalaje, instrucciones de emergencia), formación del personal, estiba y segregación (\"lejos de\", \"separado de\", \"separado por un compartimento\"…). Se actualiza cada 2 años.<\/p><\/li><li><p><b>Código IMSBC<\/b>: graneles sólidos peligrosos.<\/p><\/li><li><p>Otros modos, armonizados con el IMDG: <b>ADR<\/b> (carretera) y <b>RID<\/b> (ferrocarril).<\/p><\/li><li><p>Cada país regula además su manipulación en puerto.<\/p><\/li><\/ul>\n"}, {"id": "B1-7", "src": "Tema 1 · 7", "q": "¿Qué impacto tuvo el contenedor en la logística del comercio internacional?", "a": "\n<ul><li><p><b>Estandarización<\/b> (ISO 668, 1968): medidas comunes (20', 40', 45'; 8' de ancho; 8'6\" o 9'6\" de alto) que permiten apilar y manipular en cualquier puerto.<\/p><\/li><li><p><b>Intermodalidad<\/b>: pasa de buque a camión o tren sin abrirse ni manipular la carga.<\/p><\/li><li><p><b>Productividad portuaria<\/b>: menos tiempo de buque en puerto, menos mano de obra, terminales especializadas.<\/p><\/li><li><p><b>Menos daños y robos<\/b>: carga cerrada y precintada (precintos ISO 17712 mecánicos e ISO 18185 electrónicos).<\/p><\/li><li><p><b>Economías de escala<\/b>: buques cada vez mayores (hasta 24.000 TEU), fletes más bajos y redes hub &amp; spoke.<\/p><\/li><li><p><b>Facilitación aduanera<\/b> (OMA) y nuevos tráficos, como los perecederos gracias al reefer.<\/p><\/li><\/ul>\n<p>Resultado: abarató el transporte y fue un motor de la globalización.<\/p>\n"}, {"id": "B1-8", "src": "Tema 1 · 8", "q": "Explica el papel del contenedor reefer en el transporte de productos perecederos.", "a": "\n<p>Los perecederos (frescos, lácteos, fármacos, flores) necesitan cadena de frío y control de temperatura y humedad. Antes del reefer viajaban en buques frigoríficos o congeladores, que solo se justificaban con grandes envíos.<\/p>\n<p>El reefer supuso un cambio cualitativo:<\/p>\n<ul><li><p>Permite enviar partidas pequeñas, cada una a su temperatura (refrigerado por encima de 0 ºC, congelado por debajo).<\/p><\/li><li><p>Dejó obsoletos a los buques frigoríficos (salvo en la pesca de altura).<\/p><\/li><li><p>Potenció el comercio de perecederos a larga distancia y es puerta a puerta, sin romper la cadena de frío.<\/p><\/li><li><p>Es la primera aplicación de los smart containers: comunican incidencias en tiempo real para actuar antes de que llegue mercancía dañada.<\/p><\/li><\/ul>\n"}, {"id": "B1-9", "src": "Tema 1 · 9", "q": "Define qué es un TEU y cómo se usa para medir el tráfico portuario.", "a": "\n<p>TEU (Twenty‑foot Equivalent Unit) es la unidad equivalente a un contenedor de 20 pies. Un contenedor de 20' es 1 TEU y uno de 40' son 2 TEU (también existe el FEU, menos usado). Como el 95 % de los contenedores son de 20' o 40', permite homogeneizar.<\/p>\n<p>Usos:<\/p>\n<ul><li><p>Medir el tráfico de un puerto o terminal (TEU movidos al año).<\/p><\/li><li><p>Medir la capacidad de un buque (Panamax ≈ 4.000 TEU; MSC Irina ≈ 24.346 TEU) o de una naviera (MSC &gt; 6,8 millones de TEU).<\/p><\/li><li><p>Comparar puertos y dimensionar terminales.<\/p><\/li><\/ul>\n<p>Limitación: mide unidades, no peso ni valor, y cuenta igual un contenedor lleno que uno vacío.<\/p>\n"}, {"id": "B1-10", "src": "Tema 1 · 10", "q": "Explica las ventajas e inconvenientes del uso de palés en la manipulación portuaria.", "a": "\n<p><b>Ventajas<\/b><\/p>\n<ul><li><p>Frente al contenedor: muy económico; lo puede preparar el propio fabricante; no requiere medios de transporte ni manipulación costosos.<\/p><\/li><li><p>Frente a los envases ordinarios: apenas encarece el producto; facilita la manipulación con carretillas elevadoras; protege frente a golpes y agresiones ambientales.<\/p><\/li><\/ul>\n<p><b>Inconvenientes<\/b><\/p>\n<ul><li><p>No hay un palé estándar mundial (europalé 800×1200 mm; 1200×1000; 1219×1016 en Norteamérica…), lo que provoca desaprovechamiento de espacio en el contenedor (del 3,7 % al 15 %).<\/p><\/li><li><p>El palé de madera puede propagar plagas, por lo que exige tratamiento y certificación en el tráfico internacional.<\/p><\/li><\/ul>\n"}], "propias": [{"id": "t1-c1", "q": "Explica la diferencia entre mercancía seca y húmeda. ¿Un barril lleno de aceite es mercancía seca o húmeda?", "a": "<p>La distinción depende del <b>envase<\/b>, no del producto: es <b>húmeda<\/b> si rezuma a través de su envase y <b>seca<\/b> si no lo hace. Por eso un barril cerrado con aceite es <b>mercancía seca<\/b>. La clasificación importa para la estiba, porque una carga húmeda puede manchar o dañar a otras.<\/p>"}, {"id": "t1-c2", "q": "¿Por qué la huella del contenedor es más importante que su altura para la manipulación?", "a": "<p>La <b>huella<\/b> (ancho × largo) es lo que permite <b>apilar<\/b> contenedores y encajarlos en las celdas del buque, en los spreaders de las grúas y en los chasis. Por eso todos tienen 8' de ancho y largos normalizados (20', 40', 45'). La altura es menos crítica: el estándar es 8'6'', pero conviven high cube (9'6'') y de media altura sin romper el sistema. La ISO exige que la estructura aguante el apilado de 6 unidades cargadas.<\/p>"}, {"id": "t1-c3", "q": "¿Qué es un cassette y en qué se diferencia de un contenedor?", "a": "<ul><li>Es un <b>gran palé o contenedor metálico<\/b> para cargas que por <b>tamaño o peso<\/b> no caben en un contenedor (bobinas de acero o papel, productos forestales).<\/li><li>Soporta mucho más peso (plataformas de 50 a 120 t).<\/li><li><b>No está normalizado<\/b> (no es ISO, p. ej. el SECU).<\/li><li>Algunos ruedan, pero <b>no tienen permiso de circulación<\/b>.<\/li><li>Son muy reutilizables.<\/li><\/ul>"}, {"id": "t1-c4", "q": "Diferencia entre el Código IMDG y el Código IMSBC.", "a": "<ul><li><b>IMDG<\/b>: transporte marítimo de <b>mercancía general peligrosa<\/b> (bultos, contenedores). Clasifica en 9 clases y fija embalaje, etiquetado, documentación, estiba y segregación.<\/li><li><b>IMSBC<\/b>: <b>graneles sólidos<\/b> (salvo los granos, que tienen norma propia). Se centra en cómo cargar y manipular los buques que los llevan; surgió por el aumento de naufragios a finales del siglo XX.<\/li><\/ul><p>Ambos son de la OMI y derivan de SOLAS.<\/p>"}, {"id": "t1-c5", "q": "¿Qué es la segregación de mercancías peligrosas y cómo funciona?", "a": "<p>Es la <b>separación obligatoria<\/b> a bordo de las mercancías peligrosas <b>incompatibles<\/b> entre sí, para que un incidente con una no provoque una reacción con otra. El <b>IMDG<\/b> fija las distancias mínimas entre unidades de carga mediante una tabla: <b>cuanto mayor es el número<\/b> de segregación, <b>más lejos<\/b> deben ir.<\/p>"}, {"id": "t1-c6", "q": "Explica los tipos de precintos de un contenedor y para qué sirven.", "a": "<p>Todo contenedor cargado debe ir precintado para <b>acreditar que no ha sido abierto<\/b>.<\/p><ul><li><b>Mecánicos<\/b>: económicos y desechables (ISO 17712).<\/li><li><b>Electrónicos<\/b>: más caros y reutilizables, con tecnologías como RFID que permiten conocer su estado a distancia (ISO 18185).<\/li><\/ul>"}, {"id": "t1-c7", "q": "Diferencia entre pasajero ordinario y crucerista, y qué controles fronterizos les afectan.", "a": "<ul><li><b>Pasajero ordinario<\/b>: se desplaza de un puerto a otro como medio de transporte.<\/li><li><b>Crucerista<\/b>: viaja por <b>ocio<\/b>; el buque es el destino.<\/li><\/ul><p>En ambos casos hay que tener en cuenta los controles al embarcar y desembarcar. Las <b>personas<\/b> circulan sin control dentro del <b>Espacio Schengen<\/b> y las <b>mercancías<\/b> circulan libremente dentro de la <b>UE<\/b>.<\/p>"}, {"id": "t1-c8", "q": "¿Por qué el palé de madera exige tratamiento en el tráfico internacional? Cita una medida estándar.", "a": "<p>La madera puede <b>propagar plagas<\/b> entre países, así que el palé debe <b>tratarse y certificarse<\/b> para el comercio internacional. Además <b>no hay un palé estándar mundial<\/b>: la ISO reconoce seis medidas. La más usada en Europa es el <b>europalet de 800 × 1200 mm<\/b>.<\/p>"}, {"id": "t1-c9", "q": "Explica qué es la cadena de frío y la diferencia entre refrigeración y congelación.", "a": "<p>La <b>cadena de frío<\/b> es el sistema que mantiene un producto a temperatura controlada desde el origen hasta el destino, sin roturas. La frontera entre <b>refrigerar<\/b> y <b>congelar<\/b> son los <b>0 ºC<\/b>: se refrigera por encima (frutas, lácteos) y se congela por debajo (carne, pescado). Se apoya en embalaje especial (aislantes, sensores) y, en el mar, en el <b>contenedor reefer<\/b>.<\/p>"}], "ctx": "1. Mercancías \n 1.1 Criterios de clasificación \n \n Por sector productivo \n Por forma de presentación \n Graneles : sin envase, el único \"envase\" es el propio buque \n Sólidos → ligeros y minerales \n Líquidos \n \n \n Mercancía general : viaja envasada o clasificada, así que hay que contar las unidades (envasada, ensacada, cargas unitarias…) \n Transporte intermodal : en recipientes reutilizables que pasan de un modo a otro sin cambios (contenedores) \n \n \n Por características de la carga \n Sucia / limpia → si desprende restos o no \n Seca / húmeda → si rezuma a través del envase \n Frágil / delicada → según las aceleraciones que soporta \n Refrigerada / congelada / ordinaria \n Perecedera / no perecedera \n \n \n Por peligrosidad \n \n 1.2 El contenedor \n \n Estándar reconocido por la ISO 668 \n Medidas \n Largo: 20', 40' y 45' \n Ancho: 8' \n Alto: 8'6'' \n \n \n Huella (ancho × largo) → lo importante para la manipulación, porque facilita el apilado \n La ISO exige que resista 6 contenedores encima como máximo \n Materiales \n Acero → estructura, también cerramientos e interiores \n Aluminio → para aligerar \n Madera → interiores, a veces reforzada con fibra de vidrio \n \n \n Identificación : matrícula \n Precintos (mecánicos y electrónicos) → acreditan que no ha sido abierto \n \n 1.3 Palé \n \n Armazón para transportar carga y manejarla con maquinaria ligera \n Tipos: doble suelo, reversible, medio palé, de dos o cuatro entradas… \n \n \n \n \n Ventajas frente al contenedor \n Ventajas frente a envases ordinarios \n \n \n \n \n Muy económico \n Apenas encarece el producto \n \n \n Lo puede preparar el propio fabricante \n Facilita el manejo con carretillas \n \n \n No necesita medios de transporte costosos \n Más seguridad frente a golpes \n \n \n \n \n Inconvenientes \n No es un estándar mundial \n Los de madera pueden propagar plagas , así que necesitan tratamiento \n \n \n \n 1.4 Cassettes \n \n Gran palé o contenedor metálico para cargas que por tamaño o peso no caben en otro sitio \n Algunos pueden rodar , pero no tienen permiso de circulación \n Muy reutilizables \n \n 1.5 Mercancías perecederas \n \n Vida útil muy limitada , necesitan condiciones especiales de temperatura, humedad y tiempo \n Tipos : alimentos frescos, lácteos, farmacéuticos, productos naturales \n A tener en cuenta \n Cadena de frío \n Diferencia entre refrigeración y congelación \n Embalaje especial \n \n \n Poco usadas en el transporte marítimo hasta la aparición del contenedor reefer \n \n 1.6 Mercancías peligrosas \n Normativa según el modo \n \n \n \n Modo \n Norma \n \n \n \n \n Marítimo \n IMDG \n \n \n Carretera \n ADR \n \n \n Ferrocarril \n RID \n \n \n \n Las 9 clases \n \n \n \n Clase \n Tipo \n Notas \n \n \n \n \n 1 \n Explosivos \n Dinamita, fuegos artificiales \n \n \n 2 \n Gases \n 3 subdivisiones (oxígeno, cloro, propano…) \n \n \n 3 \n Líquidos inflamables \n Arden ellos o sus gases. 3 subdivisiones \n \n \n 4 \n Sólidos inflamables \n Igual que los líquidos \n \n \n 5 \n Oxidantes y peróxidos orgánicos \n Liberan oxígeno fácilmente o se descomponen exotérmicamente \n \n \n 6 \n Tóxicas e infecciosas \n 2 subdivisiones \n \n \n 7 \n Radiactivas \n 2 subdivisiones \n \n \n 8 \n Corrosivas \n 3 subdivisiones \n \n \n 9 \n Diversas \n Lo que no encaja en las anteriores \n \n \n \n \n Segregación por incompatibilidad : hay que mantener distancias entre unidades de carga, fijadas en el IMDG \n Cuanto mayor es el número de segregación, más lejos deben ir \n \n \n \n 2. Pasajeros \n \n Pasajero ordinario → se desplaza de un puerto a otro \n Crucerista → viaja por ocio \n Hay que tener en cuenta los controles fronterizos al embarcar y desembarcar \n Mercancías : dentro de la UE (27) circulan libremente , sin control \n Personas : dentro del Espacio Schengen circulan sin control \n \n \n Formas de presentación: granel · mercancía general · intermodal \n Contenedor ISO 668 : 20'/40'/45' × 8' × 8'6'', apilable hasta 6 \n Palé: barato y práctico , pero no es estándar mundial y la madera exige tratamiento \n Peligrosas: IMDG (mar) · ADR (carretera) · RID (tren) y 9 clases \n UE = libre circulación de mercancías · Schengen = libre circulación de personas\nAMPLIACIÓN DE LAS DIAPOSITIVAS: Para qué se clasifica : aranceles (Aduanas, la TARIC de la UE), estadísticas ( NST 2007 ), tasas portuarias ( Anexo III de la Ley de Puertos), previsión de tráficos por sector productivo. \n La forma de presentación manda : en el puerto se manipulan formas de presentación, no mercancías. Ejemplo del profesor, el cemento : a granel va en cementero, en sacos o sacos sobre palés en buque de carga general y en palés dentro de un contenedor en portacontenedores. \n Ojo con el \"vino a granel\" : si viaja en barril es mercancía general, porque el barril es un envase. \n Mercancía general : convencional o fraccionada (break-bulk: envasada, ensacada, cargas unitarias), unitizada (agrupada) y cargas de proyecto (aspas de aerogenerador, hornos). \n ISO 668 (1968) : largos iniciales de 10', 20', 30' y 40'; hoy 20', 40' y 45'. Carga máxima uniforme de 30,48 t . Los high cube miden 9'6\" de alto. \n TEU y FEU : el 95 % de los contenedores son de 20' o 40'. 1 contenedor de 20' = 1 TEU; uno de 40' = 2 TEU (1 FEU). \n Estructura : 8 vigas horizontales y 4 pilares; acceso por puertas en un testero. Acero corten por su resistencia a la corrosión. \n Precintos : mecánicos (baratos, desechables, ISO 17712 ) y electrónicos (reutilizables, con RFID, ISO 18185 ). \n Europalet : 800 × 1200 mm. La ISO reconoce seis medidas de palé, ninguna es estándar mundial. \n Cassettes : plataformas de 50 hasta 90–120 t para bobinas de papel o acero y productos forestales; sin normalizar (p. ej. el SECU). \n Perecederos : el límite entre refrigerar y congelar son los 0 ºC . El reefer dejó obsoletos a los buques frigoríficos y permitió envíos pequeños a larga distancia. Los smart containers se aplicaron primero en reefers. \n Peligrosas : el IMSBC regula graneles sólidos (salvo granos) y el IMDG , la mercancía general. El IMDG nace del convenio SOLAS ."}, {"id": "t21", "num": "2.1", "title": "Regulación internacional del transporte marítimo", "short": "Reg. internacional", "fuente": "Apuntes JH del Tema 2.1 + diapositivas del profesor", "estudio": "<h2>1. Tipos de transporte marítimo<\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Línea regular (liner)<\/strong><\/th>\n<th><strong>Tramp (servicios ocasionales)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rutas y horarios<\/td>\n<td><strong>Itinerarios y frecuencias fijos<\/strong><\/td>\n<td><strong>Sin rutas ni horarios fijos<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Carga típica<\/td>\n<td>Contenerizada / carga general<\/td>\n<td>Carga general, <strong>granel<\/strong>, cargas de buque completo<\/td>\n<\/tr>\n<tr>\n<td>Contrato<\/td>\n<td><strong>Conocimiento de embarque (B/L)<\/strong><\/td>\n<td><strong>Póliza de fletamento<\/strong> (se fleta el buque completo)<\/td>\n<\/tr>\n<tr>\n<td>Gastos<\/td>\n<td>Por cuenta de la <strong>naviera<\/strong><\/td>\n<td>Por cuenta del <strong>cargador<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. Organismos internacionales públicos<\/h2>\n<h3>2.1 ONU → CONVEMAR (UNCLOS)<\/h3>\n<ul>\n<li>Convención de la ONU sobre el Derecho del Mar; hubo <strong>tres conferencias<\/strong> (UNCLOS I, II y III).<\/li>\n<\/ul>\n<h4>Líneas base (LB)<\/h4>\n<ul>\n<li>Separan las <strong>aguas interiores<\/strong> del <strong>mar territorial<\/strong>.<\/li>\n<li><strong>LB normal<\/strong>: coincide con la línea de <strong>bajamar<\/strong> (nivel más bajo del agua).<\/li>\n<li><strong>LB recta<\/strong>: <strong>polígonos<\/strong> que unen vértices próximos a la costa.<\/li>\n<\/ul>\n<h4>Espacios marítimos (medidos desde la LB)<\/h4>\n<table>\n<thead>\n<tr>\n<th>Espacio<\/th>\n<th>Extensión<\/th>\n<th>Derechos del Estado ribereño<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Mar territorial (MT)<\/strong><\/td>\n<td>Hasta <strong>12 mn<\/strong><\/td>\n<td>Soberanía. Si dos Estados se solapan, UNCLOS fija la <strong>línea media<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Zona contigua (ZC)<\/strong><\/td>\n<td>Hasta <strong>24 mn<\/strong><\/td>\n<td><strong>Fiscalización<\/strong>: prevenir y sancionar infracciones de sus leyes<\/td>\n<\/tr>\n<tr>\n<td><strong>Zona económica exclusiva (ZEE)<\/strong><\/td>\n<td>Hasta <strong>200 mn<\/strong><\/td>\n<td>Derechos de soberanía para <strong>explorar, explotar, conservar y administrar<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Plataforma continental (PC)<\/strong><\/td>\n<td>Desde el límite exterior del MT hasta el <strong>borde de la plataforma<\/strong> o ~<strong>200 mn<\/strong><\/td>\n<td><strong>Exploración y explotación de recursos naturales<\/strong> del lecho<\/td>\n<\/tr>\n<tr>\n<td><strong>Alta mar (AM)<\/strong><\/td>\n<td>Resto (\"<strong>aguas internacionales<\/strong>\")<\/td>\n<td><strong>Común a todos<\/strong>: libertad de navegación, sobrevuelo y pesca, siempre con <strong>fines pacíficos<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Derecho de paso inocente<\/strong>: los buques extranjeros pueden cruzar el MT de otro Estado si el paso es <strong>rápido e ininterrumpido<\/strong>. También se aplica en <strong>estrechos<\/strong>.<\/li>\n<\/ul>\n<h3>2.2 IMO (Organización Marítima Internacional)<\/h3>\n<ul>\n<li><strong>Misión<\/strong>: <strong>seguridad y protección<\/strong> del transporte marítimo y <strong>prevención de la contaminación<\/strong> marina y atmosférica.<\/li>\n<\/ul>\n<h4>Comités<\/h4>\n<ul>\n<li><strong>Transversales<\/strong><ul>\n<li>Comité de <strong>Cooperación Técnica<\/strong><\/li>\n<li>Comité <strong>Jurídico<\/strong><\/li>\n<\/ul>\n<\/li>\n<li><strong>Técnicos<\/strong><ul>\n<li>Comité de <strong>Seguridad Marítima<\/strong> → seguridad y protección<ul>\n<li><strong>SOLAS<\/strong>: seguridad de la vida humana en el mar<\/li>\n<li><strong>STCW<\/strong>: formación y titulación de la gente de mar<\/li>\n<\/ul>\n<\/li>\n<li>Comité de <strong>Protección del Medio Marino<\/strong> → contaminación procedente de buques<\/li>\n<li>Comité de <strong>Facilitación<\/strong> → facilitar el tráfico marítimo internacional<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h4>Normativa ambiental clave<\/h4>\n<ul>\n<li><strong>MARPOL 73/78<\/strong> → en <strong>2011<\/strong> se adoptan normas obligatorias de <strong>eficiencia energética<\/strong>.<\/li>\n<li><strong>IMO 2020<\/strong> (en vigor el <strong>1/1/2020<\/strong>)<ul>\n<li>Límite de <strong>azufre<\/strong> en el combustible: de <strong>3,5 % → 0,5 %<\/strong><\/li>\n<li>En zonas determinadas (ECA): <strong>0,1 %<\/strong><\/li>\n<li>En <strong>puertos de la UE<\/strong>: <strong>0,1 % desde 2010<\/strong><\/li>\n<li>Cómo cumplir: <strong>combustible bajo en azufre<\/strong> (más caro) o <strong>sistemas de limpieza de gases<\/strong> (scrubbers)<\/li>\n<\/ul>\n<\/li>\n<li><strong>IMO GEI<\/strong> → estrategia de <strong>2023<\/strong> para reducir <strong>gases de efecto invernadero<\/strong>.<\/li>\n<\/ul>\n<h4>Otros convenios IMO<\/h4>\n<ul>\n<li>Reglamento para <strong>prevenir abordajes<\/strong><\/li>\n<li>Convenio sobre <strong>líneas de carga<\/strong><\/li>\n<li>Convenio sobre <strong>arqueo<\/strong> de buques<\/li>\n<\/ul>\n<h3>2.3 Otras organizaciones internacionales<\/h3>\n<ul>\n<li>De la ONU: <strong>UNCTAD<\/strong>, <strong>Organización Mundial del Comercio<\/strong><\/li>\n<li><strong>Organización Internacional del Trabajo (OIT)<\/strong><\/li>\n<li><strong>Organización Mundial de Aduanas (OMA)<\/strong><\/li>\n<li><strong>Asociación de Derecho Internacional<\/strong> → regulación de <strong>accidentes<\/strong><\/li>\n<\/ul>\n<h2>3. Organismos internacionales privados<\/h2>\n<h3>3.1 Sociedades de clasificación<\/h3>\n<ul>\n<li>Inscriben (\"clasifican\") el buque en el <strong>registro<\/strong> de una empresa privada especializada.<\/li>\n<li><strong>No es obligatorio<\/strong>, pero lo suelen <strong>exigir las aseguradoras<\/strong>.<\/li>\n<li>Actividad a lo largo de la vida del buque:<ol>\n<li><strong>Antes de construir<\/strong> → revisión del <strong>proyecto<\/strong><\/li>\n<li><strong>Durante la construcción<\/strong> → <strong>inspecciones<\/strong> de comprobación<\/li>\n<li><strong>Vida útil<\/strong> → <strong>inspecciones periódicas<\/strong><\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<h3>3.2 BIMCO<\/h3>\n<ul>\n<li>Publica <strong>contratos tipo<\/strong> de transporte marítimo.<\/li>\n<\/ul>\n<h3>3.3 Otros<\/h3>\n<ul>\n<li><strong>Comité Marítimo Internacional (CMI)<\/strong><\/li>\n<li><strong>Cámara de Comercio Internacional (CCI)<\/strong><\/li>\n<li><strong>Aseguradoras<\/strong><\/li>\n<\/ul>", "ideas": "<ul>\n<li><strong>Liner = B/L + naviera paga<\/strong> · <strong>Tramp = póliza de fletamento + cargador paga<\/strong><\/li>\n<li>Distancias desde la LB: <strong>MT 12 · ZC 24 · ZEE 200 mn<\/strong><\/li>\n<li><strong>IMO 2020<\/strong>: azufre <strong>3,5 % → 0,5 %<\/strong> (0,1 % en zonas especiales y puertos UE)<\/li>\n<li><strong>SOLAS<\/strong> = seguridad de la vida en el mar · <strong>STCW<\/strong> = formación de tripulaciones · <strong>MARPOL<\/strong> = contaminación<\/li>\n<li>Las <strong>sociedades de clasificación<\/strong> no son obligatorias, pero las aseguradoras las exigen<\/li>\n<\/ul>", "amplia": "\n<ul>\n<li><b>UNCLOS<\/b>: UNCLOS I (Ginebra 1958) y II (1960) sin acuerdo sobre la anchura del mar territorial. <b>UNCLOS III<\/b> = Convención de <b>Montego Bay 1982<\/b>, en vigor en <b>1994<\/b>; España la ratificó en 1997. Regula también el tránsito por estrechos sin peajes y el Tribunal Internacional del Derecho del Mar.<\/li>\n<li><b>IMO<\/b>: creada en <b>1948<\/b> como IMCO, operativa desde 1958, sede en <b>Londres<\/b>. Órganos: Asamblea, Consejo y Secretaría. Comités: MSC (seguridad), MEPC (medio marino), FAL (facilitación), TC y LEG.<\/li>\n<li><b>SOLAS<\/b>: nace en 1914 tras el <b>Titanic<\/b>; la versión vigente es la de <b>1974<\/b>. Construcción, incendios, salvamento, radio, navegación, cargas (VGM desde 2016), mercancías peligrosas y los códigos ISM e ISPS.<\/li>\n<li><b>MARPOL 73/78<\/b>: en vigor en 1983, <b>6 anexos<\/b>: hidrocarburos, sustancias nocivas líquidas, sustancias en bultos, aguas sucias, basuras y contaminación atmosférica (SOx, NOx, EEDI/SEEMP).<\/li>\n<li><b>ISM<\/b> (SOLAS cap. IX): sistema de gestión de la seguridad de la naviera; certificados DOC (compañía) y SMC (buque). <b>ISPS<\/b> (cap. XI-2, tras el 11-S, 2004): protección frente a actos ilícitos, con niveles 1, 2 y 3.<\/li>\n<li><b>STCW<\/b> (1978, revisado 1995 y 2010): mínimos de formación, titulación y guardias de la gente de mar.<\/li>\n<li><b>Port State Control<\/b>: el puerto inspecciona buques extranjeros y puede detenerlos. Se coordina en <b>MoU<\/b> regionales; España está en el <b>Paris MoU<\/b>.<\/li>\n<li><b>Sociedades de clasificación<\/b>: Lloyd's Register, Bureau Veritas, DNV, ABS, RINA, ClassNK (IACS). Actúan por delegación de la bandera.<\/li>\n<li><b>Mar del Sur de China<\/b>: pasa ~30 % del comercio marítimo. Reclamaciones solapadas (China, Filipinas, Vietnam, Malasia, Brunéi, Taiwán) sobre Spratly y Paracel; la \"línea de nueve trazos\" choca con las ZEE de UNCLOS (laudo de La Haya 2016).<\/li>\n<\/ul>", "mapa": {"root": "Regulación internacional", "ramas": [{"t": "Tipos de servicio", "h": ["Liner: rutas fijas, B/L, paga la naviera", "Tramp: sin rutas, póliza, paga el cargador"]}, {"t": "UNCLOS", "h": ["3 conferencias · Montego Bay 1982", "Líneas de base: normal y recta", "MT 12 · ZC 24 · ZEE 200 mn", "Plataforma continental · alta mar", "Paso inocente: rápido e ininterrumpido"]}, {"t": "IMO", "h": ["Seguridad, protección y contaminación", "Comités: MSC · MEPC · FAL · TC · LEG", "SOLAS · STCW · MARPOL"]}, {"t": "Medio ambiente", "h": ["MARPOL 73/78 · eficiencia 2011", "IMO 2020: azufre 3,5 → 0,5 %", "0,1 % en ECA y puertos UE", "Estrategia GEI 2023"]}, {"t": "Otros organismos", "h": ["UNCTAD · OMC · OIT · OMA", "Asociación de Derecho Internacional", "PSC y MoU (París)"]}, {"t": "Privados", "h": ["Sociedades de clasificación: proyecto, obra y vida útil", "No obligatorias, las piden las aseguradoras", "BIMCO: contratos tipo"]}]}, "banco": [{"id": "B4-1", "src": "Tema 4 · 1", "q": "Explica el origen y contenido básico de la Convención de las Naciones Unidas sobre el Derecho del Mar (UNCLOS).", "a": "\n<p><b>Origen<\/b>: la Convención de las Naciones Unidas sobre el Derecho del Mar se logró tras tres conferencias:<\/p>\n<ul><li><p>UNCLOS I (Ginebra, 1958): sin acuerdo sobre la anchura del mar territorial.<\/p><\/li><li><p>UNCLOS II (Ginebra, 1960): sin resultados relevantes.<\/p><\/li><li><p>UNCLOS III: Convención de Montego Bay (Jamaica) de 1982, en vigor desde 1994. España la ratificó en 1997.<\/p><\/li><\/ul>\n<p><b>Contenido<\/b>: es un texto muy extenso (unos 445 artículos contando anexos) que:<\/p>\n<ul><li><p>Define las líneas de base, las aguas interiores, el mar territorial, la zona contigua, la ZEE, la plataforma continental y la alta mar, con sus derechos.<\/p><\/li><li><p>Regula el paso inocente por el mar territorial y el tránsito por estrechos (Malaca, Gibraltar) sin peajes.<\/p><\/li><li><p>Permite a todos los Estados, ribereños o no, abanderar buques.<\/p><\/li><li><p>Trata la protección del medio marino, la investigación científica y la solución de controversias (Tribunal Internacional del Derecho del Mar).<\/p><\/li><\/ul>\n<p>Es clave porque un buque pasa la mayor parte de su vida navegando por esas aguas.<\/p>\n"}, {"id": "B4-2", "src": "Tema 4 · 2", "q": "Define los conceptos de mar territorial, zona contigua, ZEE y alta mar.", "a": "\n<p>Todas se miden desde las <b>líneas de base<\/b> (normal = bajamar; recta = polígono por puntos de la costa, como usa España).<\/p>\n<table><tr><th><p>Zona<\/p><\/th><th><p>Extensión desde la línea de base<\/p><\/th><th><p>Derechos del Estado ribereño<\/p><\/th><\/tr><tr><td><p>Mar territorial<\/p><\/td><td><p>Hasta 12 millas<\/p><\/td><td><p>Soberanía, con derecho de paso inocente (rápido e ininterrumpido) para buques extranjeros<\/p><\/td><\/tr><tr><td><p>Zona contigua<\/p><\/td><td><p>Hasta 24 millas<\/p><\/td><td><p>Fiscalización para prevenir y sancionar infracciones aduaneras, fiscales, de inmigración o sanitarias<\/p><\/td><\/tr><tr><td><p>ZEE<\/p><\/td><td><p>Hasta 200 millas<\/p><\/td><td><p>Derechos soberanos para explorar, explotar y conservar los recursos, islas artificiales, investigación y medio marino (solo fines económicos)<\/p><\/td><\/tr><tr><td><p>Alta mar<\/p><\/td><td><p>Más allá de las anteriores<\/p><\/td><td><p>Aguas internacionales, uso común: libertad de navegación, sobrevuelo y pesca, con fines pacíficos<\/p><\/td><\/tr><\/table>\n<p>La plataforma continental da derechos sobre el fondo marino hasta 200 millas o hasta el borde de la plataforma si es mayor (con aprobación de una comisión de UNCLOS).<\/p>\n"}, {"id": "B4-3", "src": "Tema 4 · 3", "q": "Explica el papel y estructura de la Organización Marítima Internacional (IMO).", "a": "\n<p><b>Origen<\/b>: creada en 1948 en Ginebra bajo la ONU como IMCO; operativa desde 1958, con sede en Londres; nombre actual desde 1982.<\/p>\n<p><b>Misión<\/b>: la seguridad y la protección del transporte marítimo y la prevención de la contaminación marina y atmosférica de los buques.<\/p>\n<p><b>Estructura<\/b>:<\/p>\n<ul><li><p>Asamblea (todos los Estados miembros), Consejo (órgano ejecutivo, presidido por el español Víctor Jiménez) y Secretaría (Secretario General Arsenio Domínguez).<\/p><\/li><li><p>Comités transversales: Cooperación Técnica (TC) y Jurídico (LEG).<\/p><\/li><li><p>Comités técnicos:<\/p><ul><li><p>Seguridad Marítima (MSC): SOLAS y STCW.<\/p><\/li><li><p>Protección del Medio Marino (MEPC): MARPOL.<\/p><\/li><li><p>Facilitación (FAL): Convenio FAL 65, documentación y digitalización de las escalas.<\/p><\/li><\/ul><\/li><\/ul>\n<p>Otros logros: Reglamento de abordajes, Convenio de Líneas de Carga 1966 (Plimsoll), Convenio de Arqueo 1969 (GT), IMO 2020 y la estrategia GEI.<\/p>\n"}, {"id": "B4-4", "src": "Tema 4 · 4", "q": "Resume los objetivos principales del Convenio SOLAS 1974.", "a": "\n<p>SOLAS (Safety Of Life At Sea) nace en 1914 tras el Titanic (1912). La versión de 1974 (en vigor en 1980) es el modelo actual, que se actualiza con enmiendas.<\/p>\n<p>Su objetivo es garantizar la seguridad de la vida humana en el mar fijando normas mínimas de construcción, equipos y operación de los buques mercantes:<\/p>\n<ul><li><p>Construcción: compartimentado, estabilidad, maquinaria e instalaciones eléctricas.<\/p><\/li><li><p>Prevención, detección y extinción de incendios.<\/p><\/li><li><p>Dispositivos de salvamento y radiocomunicaciones.<\/p><\/li><li><p>Seguridad de la navegación.<\/p><\/li><li><p>Transporte de cargas (incluido el pesaje VGM de contenedores, 2016) y de mercancías peligrosas (base del IMDG).<\/p><\/li><li><p>Gestión de la seguridad (Código ISM, cap. IX) y protección (Código ISPS, cap. XI‑2).<\/p><\/li><li><p>Normas para graneleros, naves de gran velocidad y aguas polares.<\/p><\/li><\/ul>\n"}, {"id": "B4-5", "src": "Tema 4 · 5", "q": "Explica el contenido y finalidad del Convenio MARPOL 73/78.", "a": "\n<p>El Convenio de 1973 no llegó a entrar en vigor y se unió al Protocolo de 1978: MARPOL 73/78, en vigor desde 1983. Su finalidad es prevenir la contaminación del medio marino por los buques, sea operacional o accidental.<\/p>\n<p>Se estructura en 6 anexos:<\/p>\n<ol><li><p>Hidrocarburos (incluye el doble casco de los petroleros).<\/p><\/li><li><p>Sustancias nocivas líquidas a granel.<\/p><\/li><li><p>Sustancias perjudiciales en bultos.<\/p><\/li><li><p>Aguas sucias.<\/p><\/li><li><p>Basuras.<\/p><\/li><li><p>Contaminación atmosférica: SOx (IMO 2020, límite de azufre del 3,5 % al 0,5 %; 0,1 % en zonas ECA), NOx y eficiencia energética (EEDI y SEEMP desde 2011).<\/p><\/li><\/ol>\n<p>Se actualiza constantemente según las nuevas tecnologías y exigencias ambientales.<\/p>\n"}, {"id": "B4-6", "src": "Tema 4 · 6", "q": "Describe los objetivos del Código ISM y del Código ISPS.", "a": "\n<p><b>ISM (Código Internacional de Gestión de la Seguridad, SOLAS cap. IX)<\/b><\/p>\n<ul><li><p>Objetivo: garantizar la seguridad marítima, evitar lesiones y pérdidas de vidas y prevenir daños al medio ambiente y a los bienes.<\/p><\/li><li><p>Cómo: la naviera implanta un Sistema de Gestión de la Seguridad (procedimientos, emergencias, auditorías) con una persona designada en tierra.<\/p><\/li><li><p>Certificados: el DOC para la compañía y el SMC para el buque.<\/p><\/li><\/ul>\n<p><b>ISPS / PBIP (Código de Protección de Buques e Instalaciones Portuarias, SOLAS cap. XI‑2)<\/b><\/p>\n<ul><li><p>Nace tras el 11‑S y está en vigor desde 2004.<\/p><\/li><li><p>Objetivo: proteger buques y puertos frente a actos ilícitos (terrorismo, piratería, polizones).<\/p><\/li><li><p>Cómo: planes de protección del buque y de la instalación portuaria, oficiales de protección (buque, compañía, instalación) y niveles de protección 1, 2 y 3.<\/p><\/li><\/ul>\n<p>Diferencia: el ISM trata la seguridad operacional (safety); el ISPS, la protección frente a amenazas (security).<\/p>\n"}, {"id": "B4-7", "src": "Tema 4 · 7", "q": "Explica las funciones del Convenio STCW sobre formación y titulación marítima.", "a": "\n<p>El Convenio sobre Normas de Formación, Titulación y Guardia para la Gente de Mar (1978, revisado en 1995 y 2010) fija los mínimos internacionales de formación y titulación de las tripulaciones.<\/p>\n<ul><li><p><b>Funciones<\/b>: garantizar la competencia de la gente de mar, homogeneizar las titulaciones entre países y regular las guardias y el descanso.<\/p><\/li><li><p><b>Estructura<\/b>: articulado (obligaciones de los Estados), anexo (requisitos técnicos) y Código STCW: Parte A obligatoria y Parte B de recomendaciones.<\/p><\/li><li><p><b>Capítulos<\/b> por puesto: capitán y cubierta, máquinas, radiocomunicaciones, buques especiales, emergencias y supervivencia, titulación alternativa, guardia.<\/p><\/li><\/ul>\n<p>Cada país organiza sobre esta base sus planes de estudio.<\/p>\n"}, {"id": "B4-8", "src": "Tema 4 · 8", "q": "Analiza el papel del Control del Estado Rector del Puerto (PSC) y los MoU.", "a": "\n<p><b>Problema<\/b>: las inspecciones dependían del Estado de bandera, y algunas banderas eran muy laxas. Los puertos no se atrevían a inspeccionar por temor a perder tráfico frente a sus vecinos.<\/p>\n<p><b>Solución de la OMI<\/b>: el PSC, la inspección de buques extranjeros en los puertos nacionales para verificar que el buque, sus equipos y su tripulación cumplen los convenios (SOLAS, MARPOL, STCW…). Si hay deficiencias graves, el buque puede quedar detenido.<\/p>\n<p><b>Los MoU<\/b> (memorandos de entendimiento regionales) coordinan a varios países: misma formación de inspectores, mismas normas, registro público de inspecciones y sanciones. Hay 9 MoU (París, al que pertenece España; Tokio; Viña del Mar; Caribe; Abuja; Mar Negro; Mediterráneo; Índico; Riad) y la Guardia Costera de EE. UU., que actúa en solitario.<\/p>\n<p>En Europa el Paris MoU lo coordina la EMSA.<\/p>\n"}, {"id": "BA-6", "src": "Adicional · 6", "q": "Explica los factores principales del conflicto en el Mar del Sur de China", "a": "\n<p><b>Por qué es estratégico<\/b>: por allí pasa cerca del 30 % del comercio marítimo mundial, junto a los estrechos de Malaca y Luzón, y tiene pesca, petróleo y gas.<\/p>\n<p><b>Factores del conflicto<\/b>:<\/p>\n<ul><li><p><b>Reclamaciones superpuestas<\/b> de China, Filipinas, Vietnam, Malasia, Brunéi y Taiwán, sobre todo en los archipiélagos Spratly y Paracel.<\/p><\/li><li><p><b>La \"línea de nueve trazos\"<\/b>: China reclama casi todo el mar, en choque con las ZEE de 200 millas que UNCLOS da a los vecinos. Un tribunal arbitral de La Haya (2016, caso Filipinas contra China) la declaró sin base en UNCLOS, pero China no lo acepta.<\/p><\/li><li><p><b>Militarización<\/b>: islas artificiales, bases y presencia de guardacostas.<\/p><\/li><li><p><b>Rivalidad geopolítica<\/b> con EE. UU., que defiende la libertad de navegación.<\/p><\/li><\/ul>\n<p><b>Impacto en el transporte marítimo<\/b>:<\/p>\n<ul><li><p>Riesgo de interrupción de rutas clave (Malaca, Luzón).<\/p><\/li><li><p>Subida de las primas de seguro por riesgo geopolítico.<\/p><\/li><li><p>Posible reconfiguración de corredores y costes logísticos más altos.<\/p><\/li><li><p>Más vigilancia y despliegue militar en una zona clave de la cadena de suministro global.<\/p><\/li><\/ul>\n"}], "propias": [{"id": "t21-c1", "q": "Compara los servicios de línea regular y tramp: rutas, carga, contrato y gastos.", "a": "<ul><li><b>Línea regular (liner)<\/b>: itinerarios y frecuencias fijas; carga contenerizada o general; contrato en <b>conocimiento de embarque (B/L)<\/b>; los gastos son de la <b>naviera<\/b>.<\/li><li><b>Tramp<\/b>: sin rutas ni horarios fijos; carga general, granel o buque completo; contrato en <b>póliza de fletamento<\/b>; los gastos son del <b>cargador<\/b>.<\/li><\/ul>"}, {"id": "t21-c2", "q": "¿Qué son las líneas de base y qué tipos define UNCLOS?", "a": "<p>Separan las <b>aguas interiores<\/b> del <b>mar territorial<\/b> y son el punto desde el que se miden todas las zonas marítimas.<\/p><ul><li><b>Normal<\/b>: coincide con la línea de <b>bajamar<\/b>.<\/li><li><b>Recta<\/b>: polígono que une puntos próximos a la costa (la usa España).<\/li><\/ul>"}, {"id": "t21-c3", "q": "Explica el derecho de paso inocente.", "a": "<p>UNCLOS permite a los buques extranjeros <b>atravesar el mar territorial<\/b> de otro Estado siempre que el paso sea <b>rápido e ininterrumpido<\/b> y no perjudique la paz ni la seguridad del ribereño. También se prevé el tránsito por <b>estrechos<\/b> (Gibraltar, Malaca) sin peajes.<\/p>"}, {"id": "t21-c4", "q": "¿Qué establece IMO 2020 y cómo pueden cumplirlo los buques?", "a": "<p>En vigor desde el <b>1 de enero de 2020<\/b>, baja el contenido máximo de <b>azufre<\/b> del combustible del <b>3,5 % al 0,5 %<\/b> (0,1 % en zonas especiales ECA; en los puertos de la UE ya era 0,1 % desde 2010). Se cumple usando <b>combustible bajo en azufre<\/b>, más caro, o instalando <b>sistemas de limpieza de gases<\/b> (scrubbers).<\/p>"}, {"id": "t21-c5", "q": "Enumera los comités técnicos de la IMO y los convenios que gestionan.", "a": "<ul><li><b>Seguridad Marítima (MSC)<\/b>: seguridad y protección; <b>SOLAS<\/b> y <b>STCW<\/b>.<\/li><li><b>Protección del Medio Marino (MEPC)<\/b>: contaminación de buques; <b>MARPOL<\/b>.<\/li><li><b>Facilitación (FAL)<\/b>: facilitar el tráfico internacional (documentación de escala).<\/li><\/ul><p>Además hay dos transversales: <b>Cooperación Técnica<\/b> y <b>Jurídico<\/b>.<\/p>"}, {"id": "t21-c6", "q": "¿Qué es una sociedad de clasificación? ¿Es obligatoria clasificar un buque?", "a": "<p>Es una <b>empresa privada especializada<\/b> que inscribe el buque en su registro tras comprobar que cumple sus reglas técnicas. Actúa <b>antes<\/b> de construir (revisa el proyecto), <b>durante<\/b> la construcción (inspecciones) y en la <b>vida útil<\/b> (inspecciones periódicas). <b>No es obligatoria<\/b>, pero la exigen las <b>aseguradoras<\/b>. Ejemplos: Lloyd's Register, Bureau Veritas, DNV.<\/p>"}, {"id": "t21-c7", "q": "¿Qué es BIMCO y qué otros organismos privados influyen en el transporte marítimo?", "a": "<p><b>BIMCO<\/b> publica <b>contratos tipo<\/b> de transporte marítimo (p. ej. la póliza GENCON). Otros organismos privados: las <b>sociedades de clasificación<\/b>, el <b>Comité Marítimo Internacional<\/b>, la <b>Cámara de Comercio Internacional<\/b> y las <b>aseguradoras<\/b>.<\/p>"}, {"id": "t21-c8", "q": "Compara los derechos del Estado ribereño en la zona contigua, la ZEE y la plataforma continental.", "a": "<ul><li><b>Zona contigua (hasta 24 mn)<\/b>: medidas de <b>fiscalización<\/b> para prevenir y sancionar in
